
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'socioeconomic_data_pipeline'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'socioeconomic_data_pipeline'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Re-grants read access on transformed_data to the backend's read-only role
# (no-op if the role api_ro does not exist, e.g. local dev).
on-run-end:
  - "{{ grant_api_read() }}"

snapshots:
  socioeconomic_data_pipeline:
    +target_schema: snapshots
    +strategy: check
    +check_cols: ['value']
    +unique_key: "geodata_id_nuts || '_' || year::text"
    # Deliberately false: a row that disappears from the dlt "replace" load
    # stays current (dbt_valid_to null) instead of being closed, so a partial
    # or failed reload never deletes history. Consequence: staging - and
    # everything reading it, incl. mart_nuts3_sociodata_harmonized - keeps
    # serving rows that are no longer in loaded_data (e.g. after a re-mapping
    # to other geodata_id_nuts); tests/warn_snapshot_rows_missing_in_source.sql
    # flags them.
    +hard_deletes: ignore

vars:
  # Minimum area share for an Agentur<->NUTS-3 pair in
  # mart_agentur_nuts3_crosswalk (pairs where neither share exceeds it are
  # dropped as boundary slivers); override with
  # --vars '{crosswalk_min_share: 0}' to see all intersections.
  crosswalk_min_share: 0.10

  # Target versions of the version harmonization. A new NUTS/LAU version
  # needs: (1) these vars, (2) geodata loaded (geo-importer -> dlt), (3) the
  # dlt/crosswalk side. tests/assert_reference_versions_current.sql fails
  # until the vars match the loaded geometry vintages.
  reference_nuts_version: 2024   # NUTS version all aggregates/summaries use
  reference_lau_version: 2024    # LAU vintage used for LAU-level marts
  nuts_versions: [2003, 2006, 2010, 2013, 2016, 2021, 2024]
  lau_versions: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

models:
  socioeconomic_data_pipeline:
    # Staging models from loaded_data schema
    staging:
      +materialized: view
      +schema: transformed_data
    # Intermediate models (crosswalk building blocks)
    intermediate:
      +materialized: view
      +schema: transformed_data
    # Marts models for final integrated data
    marts:
      +materialized: table
      +schema: transformed_data
      fill_gaps:
        +materialized: view
        +schema: transformed_data
