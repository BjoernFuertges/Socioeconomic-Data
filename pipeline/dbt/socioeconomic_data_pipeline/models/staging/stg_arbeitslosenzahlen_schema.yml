version: 2

models:
  - name: stg_arbeitslosenzahlen
    description: "Staging model for unemployment data - cleaned, with _dlt fields removed and proper date conversions"
    columns:
      - name: unemployment_pk
        description: "Surrogate key (artificial primary key) generated from dataset_id, geodata_id, and observation_date"
        data_type: text
        tests:
          - unique
          - not_null
          
      - name: dataset_id
        description: "Unique identifier linking to metadata"
        data_type: text
        tests:
          - not_null
          - relationships:
              to: source('loaded_data', 'arbeitslosenzahlen_metadata')
              field: dataset_id
              
      - name: geodata_id
        description: "Mapped geodata ID (LAU/NUTS code)"
        data_type: text
        tests:
          - not_null
          
      - name: geodata_name
        description: "Mapped geodata name"
        data_type: text
        tests:
          - not_null
          
      - name: mapper
        description: "Mapping method used"
        data_type: text
        
      - name: parameter
        description: "Mapping parameter"
        data_type: text
        
      - name: time_column
        description: "Original time column name from CSV"
        data_type: text
        
      - name: is_date
        description: "Whether time_column is a date or year"
        data_type: boolean
        
      - name: arbeitslose
        description: "Number of unemployed persons (original)"
        data_type: numeric
        
      - name: year
        description: "Year of observation"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1990
              max_value: 2030
              
      - name: month
        description: "Month of observation (null for yearly data)"
        data_type: integer
        
      - name: day
        description: "Day of observation"
        data_type: integer
        
      - name: time_type
        description: "Type of time data: yearly, monthly, or unknown"
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['yearly', 'monthly', 'unknown']
              
      - name: arbeitslose_numeric
        description: "Number of unemployed persons (as numeric)"
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              
      - name: observation_date
        description: "Properly formatted observation date"
        data_type: date
        tests:
          - not_null
          
      - name: load_date
        description: "Date when the data was originally loaded"
        data_type: text
        tests:
          - not_null
          
      - name: quarter
        description: "Quarter of the year (1-4) for monthly data"
        data_type: integer
        tests:
          - accepted_values:
              values: [1, 2, 3, 4]
              config:
                where: "quarter is not null"
