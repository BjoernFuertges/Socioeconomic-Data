          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetMetricsResult'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Statistische Metriken für Soziodata-Datensätze
      tags:
      - Metriken
  /metrics/derived:
    get:
      consumes:
      - application/json
      description: |-
        Gibt alle abgeleiteten Metriken aus dem Katalog zurück (z.B. Bevölkerungsdichte,
        eigenberechnete Arbeitslosenquote, Auszubildende absolut). Jede Metrik wird per Formel aus mehreren Datensätzen berechnet:
        ratio = Zähler / Nenner × scale, product = Zähler × Faktor × scale.
        Mit GET /metrics/derived/:slug können die statistischen Werte abgerufen werden.
        meta.note: Es gehen nur gültige Werte ein; bei ratio müssen Zähler und Nenner, bei product Zähler und Faktor gültig sein.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DerivedMetricEntry'
                  type: array
              type: object
      summary: Abgeleitete Metriken-Definitionen
      tags:
      - Metriken
  /metrics/derived/{slug}:
    get:
      consumes:
      - application/json
      description: |-
        Berechnet Min, Max, Mittelwert, Median, Stddev und YoY-Veränderung für eine
        abgeleitete Metrik (z.B. Bevölkerungsdichte = Bevölkerung / Fläche in km²; Auszubildende absolut = Auszubildende je 1.000 SV-Beschäftigte × SV-Beschäftigte / 1.000).
        Sind alle beteiligten Datensätze harmonisiert, werden Zähler und Nenner bzw. Faktor aus mart_nuts3_sociodata_harmonized im
        NUTS-3-Stand 'nuts_version' gelesen (Default 2024) und die Fläche aus der Geometrie desselben Stands; die Antwort nennt ihn in nuts_version.
        Formeltyp ratio: Nur Regionen mit gültigem Zähler und Nenner gehen ein. Ausgeschlossene Werte zählen excluded_invalid_count (ungültiger Zähler/Nenner oder Nenner 0),
        regions_without_geometry (keine Geometrie für den Flächennenner) und regions_without_denominator (kein Nennerwert) je Jahr.
        Formeltyp product: Nur Regionen mit gültigem Zähler und Faktor gehen ein (ein Faktor 0 ist gültig). Ausgeschlossene Werte zählen excluded_invalid_count (ungültiger Zähler/Faktor)
        und regions_without_factor (kein Faktorwert) je Jahr. excluded_regions nennt die betroffenen Regionen insgesamt.
        meta.note nennt die Regel des Formeltyps und, falls im Katalog hinterlegt, den Hinweis der Metrik (note, z.B. bei Rückrechnungen aus zwei Quellen).
      parameters:
      - description: Slug der abgeleiteten Metrik
        example: bevoelkerungsdichte
        in: path
        name: slug
        required: true
        type: string
      - description: Einzelnes Jahr filtern
        example: 2022
        in: query
        name: year
        type: integer
      - description: Jahresbereich ab
        example: 2018
        in: query
        name: from_year
        type: integer
      - description: Jahresbereich bis
        example: 2022
        in: query
        name: to_year
        type: integer
      - description: Auf NUTS-Präfix einschränken (z.B. DE1)
        example: DE1
        in: query
        name: nuts_parent_id
        type: string
      - description: NUTS-ID einer Region für Regionalwert und Ranking (im Stand nuts_version)
        example: DEF01
        in: query
        name: geodata_id_nuts
        type: string
      - default: 2024
        description: NUTS-3-Zielversion der harmonisierten Werte
        enum:
        - 2003
        - 2006
        - 2010
        - 2013
        - 2016
        - 2021
        - 2024
        in: query
        name: nuts_version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetMetricsResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Statistiken für eine abgeleitete Metrik
      tags:
      - Metriken
