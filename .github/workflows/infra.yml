# Hetzner infrastructure (Terraform). One-time setup incl. state bucket: see infra/README.md.
name: "Infrastruktur (Terraform)"

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-hetzner
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.13.x"

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive -diff
        working-directory: infra

      # No backend and no secrets, so this also runs for PRs from forks
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate hetzner
        working-directory: infra/hetzner
        run: |
          terraform init -backend=false -input=false
          terraform validate

  apply:
    name: plan + apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    # Reviewer approval is enforced via the environment settings in GitHub
    environment: infra
    # Secrets are set per step (only where Terraform needs them), not for the whole job:
    # checkout/setup-terraform and the key check do not see the Hetzner token or the state key.
    env:
      TF_VAR_server_type: ${{ vars.HCLOUD_SERVER_TYPE || 'cpx12' }}
      TF_VAR_location: ${{ vars.HCLOUD_LOCATION || 'nbg1' }}
    defaults:
      run:
        working-directory: infra/hetzner
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Most common lockout cause: the public and private deploy key do not match.
      # Hardening (key-only login for "deploy") would then lock everyone out of SSH.
      - name: Check deploy key pair
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
        run: |
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY fehlt}"
          : "${DEPLOY_SSH_PUBLIC_KEY:?Secret DEPLOY_SSH_PUBLIC_KEY fehlt}"
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$keyfile"
          chmod 600 "$keyfile"
          derived="$(ssh-keygen -y -P '' -f "$keyfile" | awk '{print $1" "$2}')"
          given="$(printf '%s' "$DEPLOY_SSH_PUBLIC_KEY" | awk '{print $1" "$2}')"
          if [[ -z "$derived" || "$derived" != "$given" ]]; then
            echo "::error::SSH_PRIVATE_KEY und DEPLOY_SSH_PUBLIC_KEY passen nicht zusammen (oder der Key hat eine Passphrase). Abbruch, sonst wäre der Server per SSH nicht erreichbar."
            exit 1
          fi
          echo "Deploy-Key-Paar passt zusammen."

      - name: Write backend config
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          : "${TF_STATE_BUCKET:?Repo-Variable TF_STATE_BUCKET fehlt (siehe infra/README.md)}"
          : "${TF_STATE_REGION:?Repo-Variable TF_STATE_REGION fehlt (z. B. fsn1)}"
          cat > backend.hcl <<EOF
          bucket    = "${TF_STATE_BUCKET}"
          region    = "${TF_STATE_REGION}"
          endpoints = { s3 = "https://${TF_STATE_REGION}.your-objectstorage.com" }
          EOF

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
        run: terraform apply -input=false -auto-approve tfplan

      # terraform output reads the state from the bucket
      - name: Summary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          {
            echo "### Server"
            echo "- IPv4 (A-Record für APP_HOST, Repo-Variable SSH_HOST): \`$(terraform output -raw server_ipv4)\`"
            echo "- IPv6 (AAAA-Record): \`$(terraform output -raw server_ipv6)\`"
          } >> "$GITHUB_STEP_SUMMARY"
