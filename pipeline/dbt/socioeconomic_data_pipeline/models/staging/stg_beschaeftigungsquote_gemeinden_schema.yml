version: 2

models:
  - name: stg_beschaeftigungsquote_gemeinden
    description: "Staging model for the employment rate per municipality (LAU), cleaned, with derived observation date and quality flag."
    columns:
      - name: beschaeftigungsquote_lau_pk
        description: "Surrogate key built from original_id_1 and year"
        data_type: text
        tests:
          - unique
          - not_null

      - name: original_id_1
        description: "Municipality ID (LAU identifier) from the source file"
        data_type: text
        tests:
          - not_null

      - name: original_name
        description: "Municipality name from the source file"
        data_type: text
        tests:
          - not_null

      - name: geodata_name
        description: "Mapped geodata name"
        data_type: text

      - name: geodata_id_nuts
        description: "NUTS-3 code of the region (empty for municipalities without a NUTS-3 mapping)"
        data_type: text
        tests:
          - not_null

      - name: geodata_id_lau
        description: "Mapped LAU ID of the municipality"
        data_type: text
        tests:
          - not_null

      - name: geodata_id_ars
        description: "Official regional key after mapping"
        data_type: text
        tests:
          - not_null

      - name: mapper
        description: "Mapping method"
        data_type: text

      - name: parameter
        description: "Mapping parameter"
        data_type: text

      - name: geodata_level
        description: "Geodata level (LAU for municipalities)"
        data_type: text

      - name: geodata_year
        description: "Reference year of the geodata"
        data_type: integer
        tests:
          - not_null

      - name: year
        description: "Year of observation"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2030

      - name: beschaeftigungsquote_prozent
        description: "Employment rate in percent. Can exceed 100 in commuter hubs and very small municipalities (workplace-based numerator); see is_low_confidence. A value of 0 means 'not defined / missing' in the source and is flagged invalid via has_valid_value"
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000
              inclusive: true

      - name: observation_date
        description: "Observation date (1 January of the year)"
        data_type: date
        tests:
          - not_null

      - name: has_valid_value
        description: "True if the employment rate is plausible (above 0 and up to 1000 %). A rate of 0 is treated as invalid, because the source uses 0 for undefined or missing values (e.g. municipality-free areas). Values above 100 % are kept; negative values, 0 and extreme outliers are excluded"
        data_type: boolean

      - name: is_low_confidence
        description: "True if the municipality has fewer than 500 inhabitants (latest Eurostat LAU vintage), so the rate rests on very few people and is volatile. The value is still included in aggregations; false when the population is unknown"
        data_type: boolean
        tests:
          - not_null
