  /custom-regions/dataset-aggregate:
    post:
      consumes:
      - application/json
      description: 'Verschneidet das übergebene Polygon mit den Geometrien der Quelldaten
        und aggregiert die Werte. Je Datensatz wird die feinste verfügbare Ebene genutzt
        (LAU vor NUTS-3; Agenturbezirks-Daten liegen nur auf Agenturbezirks-Ebene
        vor). Zählgrößen (sum) werden flächenanteilig verteilt, Quoten/Durchschnitte
        (weighted_avg) bevorzugt bevölkerungsgewichtet gemittelt, Werte je Erwerbstätigen
        (weighted_avg_employees) erwerbstätigengewichtet. Näherungswerte (z. B. Mediane,
        Quoten) sind über value_kind und aggregation_method gekennzeichnet. Die Region
        wird nicht gespeichert. NUTS-3/LAU-Bezug: Version 2024.'
      parameters:
      - description: GeoJSON-Region und Datensätze
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CustomRegionAggregateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_handlers.CustomRegionAggregateRow'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Datensätze für eine Custom-Region (GeoJSON)
      tags:
      - Geo
  /custom-regions/datasets:
