version: 2

models:
  - name: stg_dataset_license_history
    description: "Full history of license and license_url values per dataset_slug, one row per validity period. valid_to is null while the value is current."
    columns:
      - name: dataset_slug
        description: "Dataset slug, same as dataset_slug in stg_dataset_metadata"
        data_type: text
        tests:
          - not_null

      - name: license
        description: "License name as valid during [valid_from, valid_to)"
        data_type: text

      - name: license_url
        description: "License text URL as valid during [valid_from, valid_to)"
        data_type: text

      - name: valid_from
        description: "First date on which this license value was observed"
        data_type: date
        tests:
          - not_null

      - name: valid_to
        description: "Last date on which this license value was still valid; null = currently valid"
        data_type: date
