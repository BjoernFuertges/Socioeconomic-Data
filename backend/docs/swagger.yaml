  /agenturbezirke/dataset-aggregate/{slug}:
    get:
      consumes:
      - application/json
      description: 'Liefert für einen Kreis-grain-Datensatz und ein Jahr den auf Agenturbezirk-Ebene
        aggregierten Wert je Agenturbezirk (siehe mart_agentur_dataset_aggregate)
        - für die Kartendarstellung. Geometrien kommen weiterhin aus GET /agenturbezirke/period.
        LIMITATIONEN: Summen (Zählgrößen) sind Summen der Kreis-Werte; Quoten und
        Durchschnitte sind ein bevölkerungsgewichteter Durchschnitt der Kreis-Werte
        (Werte je Erwerbstätigen: erwerbstätigengewichtet; Rückfall auf Flächengewichte,
        wenn die Gewichte fehlen) - eine Näherung, keine exakte Neuberechnung, da
        Zähler/Nenner nicht vorliegen und die Gesamtbevölkerung nur Ersatz für die
        eigentliche Bezugsgröße ist. Mediane lassen sich nicht aus Kreis-Medianen
        zusammensetzen (nur Schätzung). Berlin: ein Kreis verteilt sich auf drei Agenturbezirke,
        Summen werden flächenanteilig aufgeteilt. Pro Punkt kennzeichnen aggregation_method
        und value_kind das Verfahren.'
