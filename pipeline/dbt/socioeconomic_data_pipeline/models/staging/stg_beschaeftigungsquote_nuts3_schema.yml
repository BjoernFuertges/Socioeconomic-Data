version: 2

models:
  - name: stg_beschaeftigungsquote_nuts3
    description: "Staging-Modell für Beschäftigungsquote je NUTS-3-Region (aggregiert aus Gemeinden-Ebene) – gewichtet nach Bevölkerung"
    columns:
      - name: beschaeftigungsquote_nuts3_pk
        description: "Surrogate Key aus geodata_id_nuts und year"
        data_type: text
        tests:
          - unique
          - not_null

      - name: geodata_id_nuts
        description: "NUTS-3-Code der Region"
        data_type: text
        tests:
          - not_null

      - name: year
        description: "Jahr der Beobachtung"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2030

      - name: observation_date
        description: "Beobachtungsdatum (01.01. des jeweiligen Jahres)"
        data_type: date
        tests:
          - not_null

      - name: beschaeftigungsquote_prozent
        description: "Beschäftigungsquote in Prozent – bevölkerungsgewichtet über Gemeinden (0–100)"
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

      - name: beschaeftigungsquote_median
        description: "Median der Beschäftigungsquoten – 50. Perzentil über Gemeinden in der Region"
        data_type: numeric

      - name: beschaeftigungsquote_ungewichtet
        description: "Ungewichteter Durchschnitt der Beschäftigungsquoten über Gemeinden"
        data_type: numeric

      - name: gemeinden_count
        description: "Anzahl der Gemeinden, die in die Aggregation eingegangen sind"
        data_type: integer
