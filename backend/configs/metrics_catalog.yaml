# Abgeleitete Metriken: per Formel aus mehreren Datensätzen berechnet.
# Unterstützte Formeltypen:
#   ratio   - Zähler / Nenner × Scale. Nenner-Quellen: dataset (RouteSlug +
#             Spalte) oder builtin (nuts_geometry_area_sqkm).
#   product - Zähler × Faktor × Scale. Faktor: nur dataset (kein builtin).
# Bei ratio müssen Zähler und Nenner absolute Größen sein: Datensätze, die schon
# Quoten sind (z.B. auszubildende = Auszubildende je 1.000 SV-Beschäftigte),
# nicht nochmals durch die Bevölkerung teilen. Eine solche Quote lässt sich mit
# product über ihre Bezugsgröße in eine absolute Zahl zurückrechnen.
# note (optional) wird bei GET /metrics/derived/{slug} an meta.note angehängt.
derived_metrics:
  - slug: bevoelkerungsdichte
    label: Bevölkerungsdichte
    description: >
      Einwohner je km² der NUTS-3-Region, berechnet aus Bevölkerungszahl und
      Regionsfläche (PostGIS ST_Area auf ETRS89-LAEA-Projektion, EPSG:3035).
    unit: "EW/km²"
    formula:
      type: ratio
      numerator:
        dataset: bevoelkerung
        column: bevoelkerung
      denominator:
        builtin: nuts_geometry_area_sqkm
      scale: 1.0

  - slug: eigenberechnete-arbeitslosenquote
    label: Eigenberechnete Arbeitslosenquote
    description: >
      Eigene Berechnung: Arbeitslose je 100 Einwohner aus den Kreisdaten
      (stg_arbeitslose_kreise / stg_bevoelkerung_kreise × 100).
      Abweichungen von offiziellen Quoten sind methodisch bedingt.
    unit: "%"
    formula:
      type: ratio
      numerator:
        dataset: arbeitslose
        column: arbeitslose
      denominator:
        dataset: bevoelkerung
        column: bevoelkerung
      scale: 100.0

  - slug: auszubildende-absolut
    label: Auszubildende (absolut, eigene Berechnung)
    description: >
      Eigene Berechnung aus BBSR auszubildende und BA sv_beschaeftigte:
      Auszubildende je 1.000 SV-Beschäftigte × SV-Beschäftigte am Arbeitsort
      (Stichtag 30. Juni) / 1.000. Rückrechnung, kein gemessener Wert;
      nur Jahre, für die beide Quellen vorliegen (BA ab 2007).
    unit: "Personen"
    note: >-
      Auszubildende absolut ist eine Rückrechnung (BBSR-Quote × BA-Beschäftigte / 1.000),
      kein gemessener Wert: BBSR und BA können unterschiedliche Revisionsstände haben,
      bei umgeschlüsselten NUTS-3-Regionen ist die harmonisierte Quote ein gewichteter
      Mittelwert, das Produkt also eine Näherung. Zeitraum derzeit 2007–2023 (BA-Beschäftigte ab 2007, BBSR-Quote bis 2023).
      Jahre davor sind ohne BA-Faktor ausgeschlossen: ohne Jahresfilter erscheinen daher
      alle Regionen in excluded_regions/regions_without_factor (mit from_year=2007 nicht).
    formula:
      type: product
      numerator:
        dataset: auszubildende
        column: auszubildende
      factor:
        dataset: sv_beschaeftigte
        column: sv_beschaeftigte
      scale: 0.001
