  /custom-regions/dataset-aggregate:
    post:
      consumes:
      - application/json
      description: 'Verschneidet das übergebene Polygon mit den Geometrien der Quelldaten
        und aggregiert die Werte. Je Datensatz wird die feinste verfügbare Ebene genutzt
        (LAU vor NUTS-3; Agenturbezirks-Daten liegen nur auf Agenturbezirks-Ebene
        vor). Zählgrößen (sum) werden flächenanteilig verteilt, Quoten/Durchschnitte
        (weighted_avg) bevorzugt bevölkerungsgewichtet gemittelt. Näherungswerte (z.
        B. Mediane, Quoten) sind über value_kind und aggregation_method gekennzeichnet.
        Die Region wird nicht gespeichert. NUTS-3/LAU-Bezug: Version 2024.'
      parameters:
      - description: GeoJSON-Region und Datensätze
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CustomRegionAggregateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handlers.CustomRegionAggregateRow'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Datensätze für eine Custom-Region (GeoJSON)
      tags:
      - Geo
  /custom-regions/datasets:
    get:
      description: 'Gibt je Datensatz/Indikator die Quellebene (lau, nuts3, agentur),
        die Aggregationsart (sum, weighted_avg) und die Kennzeichnung der Näherung
        (kind) zurück. Namen und Lizenz: GET /datasets/{slug}.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handlers.customRegionMeta'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Für Custom-Regionen abfragbare Datensätze
      tags:
      - Geo
  /datasets:
    get:
      consumes:
      - application/json
      description: |-
        Liefert pro Datensatz Herkunft, Lizenz, Beschreibung, Einheit und Abdeckungszeitraum
        sowie eine persistente URI. Lizenz ist "unbekannt", solange die tatsächlichen Nutzungsbedingungen der Quelle noch nicht recherchiert wurden.
        ?datasets= filtert auf einzelne Slugs (kommagetrennt, leer = alle) - gedacht für den
        gleichzeitigen Metadaten-Export neben einem Daten-Download
        Format per Accept-Header (application/json oder text/csv) oder ?format=csv|json; ?download=1 setzt Content-Disposition.
      parameters:
      - description: Kommagetrennte Datensatz-Slugs (leer = alle)
        example: bevoelkerung,arbeitslose
        in: query
        name: datasets
        type: string
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.DatasetCatalogEintrag'
                  type: array
              type: object
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Datensatz-Katalog (Herkunft, Lizenz, Beschreibung)
      tags:
      - Datensatz-Katalog
  /datasets/{slug}:
    get:
      consumes:
      - application/json
      description: |-
        Liefert Herkunft, Lizenz, Beschreibung, Einheit und Abdeckungszeitraum für einen Datensatz-Slug.
        Format per Accept-Header (application/json oder text/csv) oder ?format=csv|json; ?download=1 setzt Content-Disposition.
