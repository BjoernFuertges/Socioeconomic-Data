  /metrics:
    get:
      consumes:
      - application/json
      description: |-
        Berechnet Min, Max, Mittelwert, Median und Standardabweichung je Jahr für einen oder mehrere Datensätze.
        Mehrere 'dataset'-Parameter kombinieren unterschiedliche Datensätze in einer Antwort.
        Mit 'geodata_id_nuts' werden zusätzlich der Regionalwert und das Ranking der Region zurückgegeben.
        Für aufeinanderfolgende Jahre wird die prozentuale Veränderung (YoY) berechnet.
        Harmonisierte Kreis-Datensätze werden aus mart_nuts3_sociodata_harmonized im NUTS-3-Stand 'nuts_version' berechnet (Default 2024; die Antwort nennt ihn in nuts_version), sodass jede Region je Jahr genau einmal zählt.
        Nur gültige Werte gehen ein (has_valid_value; harmonisierte Werte nur, wenn alle beteiligten Quellwerte gültig sind); ausgeschlossene Werte zählt excluded_invalid_count je Jahr und Spalte, excluded_regions die betroffenen Regionen, meta.note erklärt das.
        Spalten ohne harmonisierte Entsprechung (beschaeftigungsquote_median, beschaeftigungsquote_ungewichtet, gemeinden_count von beschaeftigungsquote-nuts3) und nicht harmonisierte Datensätze (beschaeftigungsquote-gemeinden) kommen weiter ungeharmonisiert aus der Staging-Tabelle (nuts_version fehlt dann in der Antwort).
      parameters:
      - collectionFormat: multi
        description: Datensatz-Slug(s), z.B. schuldnerquote (mehrfach angeben für
          mehrere Datensätze)
        example: schuldnerquote
        in: query
        items:
          type: string
        name: dataset
        required: true
        type: array
      - description: Einzelnes Jahr filtern
        example: 2022
        in: query
        name: year
        type: integer
      - description: Jahresbereich ab
        example: 2018
        in: query
        name: from_year
        type: integer
      - description: Jahresbereich bis
        example: 2022
        in: query
        name: to_year
        type: integer
      - description: Auf NUTS-Präfix einschränken (z.B. DE1 für alle Kreise in Bayern)
        example: DE1
        in: query
        name: nuts_parent_id
        type: string
      - description: NUTS-ID einer Region für Regionalwert und Ranking (im Stand nuts_version)
        example: DEF01
        in: query
        name: geodata_id_nuts
        type: string
      - default: 2024
        description: NUTS-3-Zielversion der harmonisierten Werte
        enum:
        - 2003
        - 2006
        - 2010
        - 2013
        - 2016
        - 2021
        - 2024
        in: query
        name: nuts_version
        type: integer
      produces:
      - application/json
      responses:
