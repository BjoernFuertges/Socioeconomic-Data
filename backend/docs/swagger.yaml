  /regions/{region_type}/{region_id}/data:
    get:
      consumes:
      - application/json
      description: 'Stellt die gewünschten Datensätze einer Region (NUTS, LAU oder
        Agenturbezirk) aus den bestehenden Marts zusammen und liefert sie in einem
        einheitlichen Long-Format (region_type, region_id, dataset_slug, year, month,
        value, is_computed, is_interpolated, aggregation_method, value_kind, source_region_count).
        scope=raw liefert die Ursprungswerte der Region (NUTS-3: interpolierte Kreis-Zeitreihe;
        LAU: interpolierte Gemeinde-Zeitreihe; Agentur: monatliche BA-Werte ba_arbeitslose/ba_unterbeschaeftigung),
        scope=aggregated die berechneten Werte (NUTS-0/1/2 und Agenturbezirke: aus
        Kreisen aggregiert; NUTS-3: aus Gemeinden aggregiert). NUTS-0/1/2 haben keine
        Rohwerte, LAU keine aggregierten Werte. Format per Accept-Header (application/json
        oder text/csv) oder ?format=csv|json; ?download=1 setzt Content-Disposition.'
      parameters:
      - description: Regionstyp
        enum:
        - nuts
        - lau
        - agentur
        in: path
        name: region_type
        required: true
        type: string
      - description: nuts_id, gisco_id bzw. ba_schl
        example: DE300
        in: path
        name: region_id
        required: true
        type: string
      - description: Kommagetrennte Datensatz-Slugs (leer = alle verfügbaren)
        example: bevoelkerung,arbeitslose
        in: query
        name: datasets
        type: string
      - default: both
        description: raw, aggregated oder both (kommagetrennt)
        enum:
        - raw
        - aggregated
        - both
        in: query
        name: scope
        type: string
      - description: Frühestes Jahr
        in: query
        name: from_year
        type: integer
      - description: Spätestes Jahr
        in: query
        name: to_year
        type: integer
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
