      description: |-
        Führt eine räumliche Abfrage (intersects/contains) gegen NUTS oder LAU Geometrien aus.
        Body höchstens 5 MiB (sonst 413), Geometrie höchstens 200000 Stützpunkte, in WGS84 ([lon, lat]) (sonst 400). Punkte und Linien sind erlaubt und müssen OGC-gültig sein (sonst 400).
