version: 2

models:
  - name: stg_beschaeftigungsquote_nuts3
    description: "Staging model for the employment rate per NUTS-3 region, aggregated from municipality level and weighted by population."
    columns:
      - name: beschaeftigungsquote_nuts3_pk
        description: "Surrogate key built from geodata_id_nuts and year"
        data_type: text
        tests:
          - unique
          - not_null

      - name: geodata_id_nuts
        description: "NUTS-3 code of the region"
        data_type: text
        tests:
          - not_null

      - name: year
        description: "Year of observation"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2000
              max_value: 2030

      - name: observation_date
        description: "Observation date (1 January of the year)"
        data_type: date
        tests:
          - not_null

      - name: beschaeftigungsquote_prozent
        description: "Employment rate in percent (0-100): mean of the municipal rates weighted by each municipality's total population from the newest Eurostat LAU vintage containing it, the same weight for every year (approximation - the rate refers to residents aged 15-64, and Eurostat's LAU population is not a reliable historical series). Municipalities without a weight are left out; mart_beschaeftigungsquote_nuts3.weight_coverage shows the share that has one."
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

      - name: beschaeftigungsquote_median
        description: "Median of the municipal employment rates in the region (50th percentile)"
        data_type: numeric

      - name: beschaeftigungsquote_ungewichtet
        description: "Unweighted mean of the municipal employment rates"
        data_type: numeric

      - name: gemeinden_count
        description: "Number of municipalities included in the aggregation"
        data_type: integer
