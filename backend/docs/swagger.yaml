  github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetCatalogEintrag:
    properties:
      algorithm:
        type: string
      dataset_slug:
        example: bevoelkerung
        type: string
      dataset_uri:
        description: |-
          DatasetURI is a persistent identifier (urn:soziodata:dataset:<slug>)
          derived deterministically from DatasetSlug - not an artificial random ID.
        example: urn:soziodata:dataset:bevoelkerung
        type: string
      description:
        example: Zahl der Erwerbstätigen in 1000 Personen
        type: string
      description_long:
        type: string
      geodata_level:
        example: NUTS_3
        type: string
      geodata_year:
        example: 2024
        type: integer
      license:
        example: unbekannt
        type: string
      license_backfilled:
        description: |-
          LicenseBackfilled is true if the dataset contains years before
          LicenseTrackedSince - the current license was then applied retroactively to
          these older years without being independently verified for them.
        example: true
        type: boolean
      license_tracked_since:
        description: |-
          LicenseTrackedSince is the date since which this dataset's license has been
          observed via snap_dataset_license; null if no dbt snapshot has run yet.
        example: "2026-09-11"
        type: string
      license_url:
        type: string
      max_year:
        example: 2023
        type: integer
      min_year:
        example: 1995
        type: integer
      name:
        example: Bevölkerung
        type: string
      number_type:
        example: absolute
        type: string
      provenance:
        example: Laufende Raumbeobachtung des BBSR; Fortschreibung des Bevölkerungsstandes
        type: string
      total_records:
        example: 11600
        type: integer
      unit:
        example: Einwohner
        type: string
      updated_at:
        type: string
    type: object
  github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetMetricsResult:
    properties:
      by_year:
        items:
          $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetYearMetrics'
        type: array
      column:
        example: schuldnerquote_prozent
        type: string
      dataset:
        example: schuldnerquote
        type: string
      excluded_invalid_count:
        description: |-
          ExcludedInvalidCount sums DatasetYearMetrics.ExcludedInvalidCount over
          all years of the filter (also years without any valid value, which are
          missing from by_year).
        example: 5
        type: integer
      excluded_regions:
        description: |-
          ExcludedRegions is the number of distinct regions with at least one
          value left out for any reason (invalid, no geometry, no denominator,
          no factor).
        example: 3
        type: integer
      nuts_version:
        description: |-
          NutsVersion is the NUTS-3 version the values were harmonized to; absent
          when the column has no harmonized counterpart and the unharmonized
          staging values were used.
        example: 2024
        type: integer
      regions_without_denominator:
        example: 0
        type: integer
      regions_without_factor:
        example: 0
        type: integer
      regions_without_geometry:
        description: |-
          RegionsWithoutGeometry / RegionsWithoutDenominator (ratio) and
          RegionsWithoutFactor (product): distinct regions left out at least once
          for that reason (derived metrics only).
        example: 1
        type: integer
    type: object
