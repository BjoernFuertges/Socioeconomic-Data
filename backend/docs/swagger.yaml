  /nuts/{nuts_id}:
    get:
      consumes:
      - application/json
      description: 'Gibt Bevölkerung, Schuldnerquote und Arbeitslosenzahlen für eine
        NUTS-Region zurück. Das NUTS-Level wird automatisch anhand der Code-Länge
        erkannt: 2 Zeichen = NUTS-0 (Land), 3 = NUTS-1 (Bundesland), 4 = NUTS-2 (Regierungsbezirk),
        5 = NUTS-3 (Kreis). Standard: neuestes verfügbares Jahr. Mit ?all=true: Zeitreihe
        aller Jahre. Mit ?year=YYYY: bestimmtes Jahr. Mit ?part=metadata werden nur
        Geo-Metadaten zurückgegeben, mit ?part=socioeconomic nur die sozioökonomischen
        Daten. Für NUTS-Level 0–2 enthält region_name mangels Namenstabelle den NUTS-Code
        selbst.'
      parameters:
      - description: NUTS-Code der Region (Level 0–3)
        example: DE111
        in: path
        name: nuts_id
        required: true
        type: string
      - description: Jahr (gibt neuestes Jahr zurück wenn nicht angegeben)
        example: 2022
        in: query
        name: year
        type: integer
      - description: Alle verfügbaren Jahre zurückgeben
        example: false
        in: query
        name: all
        type: boolean
      - default: full
        description: 'Antwortausschnitt: full, metadata oder socioeconomic'
        enum:
        - full
        - metadata
        - socioeconomic
        in: query
        name: part
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.NutsRegionTimeSeries'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Alle Indikatoren für eine NUTS-Region (Level 0–3)
      tags:
      - NUTS
