version: 2

models:
  - name: stg_dataset_license_history
    description: "Volle Historie der license/license_url-Werte je dataset_slug aus snap_dataset_license (eine Zeile pro Gültigkeitsperiode, valid_to = null bedeutet noch aktuell)"
    columns:
      - name: dataset_slug
        description: "Dataset-Slug, identisch zu dataset_slug in stg_dataset_metadata"
        data_type: text
        tests:
          - not_null

      - name: license
        description: "Lizenzbezeichnung, wie sie zum Zeitpunkt [valid_from, valid_to) galt"
        data_type: text

      - name: license_url
        description: "URL zum Lizenztext, wie sie zum Zeitpunkt [valid_from, valid_to) galt"
        data_type: text

      - name: valid_from
        description: "Erstes Datum, an dem dieser Lizenzwert beobachtet wurde"
        data_type: date
        tests:
          - not_null

      - name: valid_to
        description: "Letztes Datum, an dem dieser Lizenzwert noch galt; null = aktuell gültig"
        data_type: date
