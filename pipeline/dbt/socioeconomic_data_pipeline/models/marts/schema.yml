version: 2

models:
  - name: mart_region_datasets
    description: "Vorberechnete Tabelle: verfügbare (geodata_id_nuts, dataset_slug, year)-Kombinationen aus allen Staging-Modellen. Dient als Index für den /datasets-Endpunkt."
    columns:
      - name: geodata_id_nuts
        description: "NUTS-Code der Region (z.B. DEF01)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Datensatz-Slug (entspricht RouteSlug in der Go-API, z.B. bevoelkerung)"
        tests:
          - not_null
      - name: year
        description: "Datenjahr"
        tests:
          - not_null

  - name: lau_integrated
    description: "Integrated LAU dataset combining geometry and population data for all available years"
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO (Eurostat)"
        tests:
          - not_null
      - name: year
        description: "Data year"
        tests:
          - not_null
      - name: lau_name_national
        description: "LAU name in national language"
      - name: lau_name_latin
        description: "LAU name in Latin characters"
      - name: cntr_code
        description: "Country code (2-letter ISO)"
        tests:
          - not_null
      - name: nuts_id
        description: "NUTS region identifier"
      - name: nuts3_id
        description: "Kanonischer NUTS-3-Parent: deklarierte Quellspalte (nuts_3_code/nuts_3), sonst räumlich ermittelter Fallback über int_lau_nuts3_spatial_link (größte Flächenüberlappung gegen die aktuelle NUTS-3-Version)"
      - name: nuts3_link_source
        description: "'declared' (aus Quelldaten) oder 'spatial_estimate' (räumlich ermittelt, keine amtliche Zuordnung)"
      - name: geometry
        description: "PostGIS geometry (polygon) in EPSG:3035"
      - name: population
        description: "Population count for the year"
      - name: missing_population_data
        description: "Flag indicating if population data is missing for this LAU/year"
      - name: year_match
        description: "Flag indicating if geometry and population year match"
      - name: total_years_available
        description: "Total number of years available for this LAU"
      - name: years_with_population
        description: "Number of years with population data for this LAU"

  - name: mart_nuts3_summary
    description: "Alle verfügbaren sozioökonomischen Indikatoren je NUTS-3-Region und Jahr. Basis ist ein FULL OUTER JOIN zwischen Bevölkerung und Schuldnerquote; Arbeitslosenzahlen werden per LEFT JOIN ergänzt (nur Jahresdaten)."
    columns:
      - name: nuts_id
        description: "NUTS-3-Code der Region (z.B. DE111)"
        tests:
          - not_null
      - name: region_name
        description: "Name der Region"
      - name: year
        description: "Datenjahr"
        tests:
          - not_null
      - name: bevoelkerung
        description: "Bevölkerungszahl (null wenn keine Daten für dieses Jahr)"
      - name: schuldnerquote_prozent
        description: "Schuldnerquote in Prozent (null wenn keine Daten für dieses Jahr)"
      - name: arbeitslose
        description: "Zahl der Arbeitslosen (Jahresdurchschnitt). Kann null sein, da Arbeitsagenturbezirke nicht 1:1 mit NUTS-3-Kreisen übereinstimmen."
      - name: yoy_change_percent
        description: "Veränderung der Arbeitslosenzahlen gegenüber dem Vorjahr in Prozent"

  - name: mart_nuts_geometry
    description: "NUTS-Geometrien mit GeoJSON-Ausgabe und Geometrie-Metadaten für verfügbare Referenzjahre"
    columns:
      - name: nuts_id
        description: "NUTS-Code der Region"
        tests:
          - not_null
      - name: levl_code
        description: "NUTS-Level (0-3)"
      - name: country_code
        description: "ISO-Ländercode"
      - name: region_name
        description: "Regionsname"
      - name: year
        description: "Referenzjahr der Geometrie"
        tests:
          - not_null
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84"
      - name: has_valid_geometry
        description: "Flag für valide Geometrie"

  - name: lau_data_quality
    description: "Data quality metrics and issue tracking for LAU integration"
    columns:
      - name: report_type
        description: "Type of report: summary, missing_data, or year_mismatch"
        tests:
          - not_null
          - accepted_values:
              values: ['summary', 'missing_data', 'year_mismatch']
      - name: year
        description: "Data year"
        tests:
          - not_null
      - name: population_coverage_percent
        description: "Percentage of LAUs with population data for the year"
      - name: issue_type
        description: "Description of data quality issue"

  - name: mart_nuts_geometry_historized
    description: "Historisierte NUTS-Geometrien. Eine Zeile je Region und Geometrie-Periode. Vintages mit identischer Geometrie werden zusammengefasst. Datenquelle: stg_nuts_geometry."
    columns:
      - name: nuts_id
        description: "NUTS-Code der Region (z.B. DE111)"
        tests:
          - not_null
      - name: levl_code
        description: "NUTS-Level (0–3)"
      - name: country_code
        description: "ISO-Ländercode (2-stellig)"
      - name: region_name
        description: "Regionsname"
      - name: valid_from
        description: "Erstes Vintage-Jahr, in dem diese Geometrie-Version erscheint"
        tests:
          - not_null
      - name: valid_to
        description: "Letztes Jahr, in dem diese Version gültig war. NULL bedeutet noch aktuell."
      - name: max_vintage_year
        description: "Letztes Vintage-Jahr, in dem diese Geometrie-Version vorlag"
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "Flag: true wenn geometry_3035 nicht null und nicht leer"

  - name: mart_lau_geometry_historized
    description: "Historisierte LAU-Geometrien (Local Administrative Units). Eine Zeile je LAU-Einheit und Geometrie-Periode. Vintages mit identischer Geometrie werden zusammengefasst. Datenquelle: stg_lau_geometry."
    columns:
      - name: gisco_id
        description: "Eindeutiger LAU-Identifier aus GISCO (Eurostat)"
        tests:
          - not_null
      - name: country_code
        description: "ISO-Ländercode (2-stellig)"
      - name: lau_id
        description: "LAU-Identifier (national)"
      - name: lau_name
        description: "Name der LAU-Einheit"
      - name: nuts_3
        description: "NUTS-3-Code der übergeordneten Region (nullable)"
      - name: valid_from
        description: "Erstes Vintage-Jahr, in dem diese Geometrie-Version erscheint"
        tests:
          - not_null
      - name: valid_to
        description: "Letztes Jahr, in dem diese Version gültig war. NULL bedeutet noch aktuell."
      - name: max_vintage_year
        description: "Letztes Vintage-Jahr, in dem diese Geometrie-Version vorlag"
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "Flag: true wenn geometry_3035 nicht null und nicht leer"

  - name: mart_socioeconomic_inventory
    description: "Voraggregiertes Inventar der verfügbaren Soziodaten je Datensatz, Jahr und Geodatenebene"
    columns:
      - name: dataset
        description: "Dataset-Slug (API-Route, z.B. arbeitslose oder beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: geodata_level
        description: "Geodatenebene (z.B. NUTS_3, LAU)"
        tests:
          - not_null
      - name: records
        description: "Anzahl Datensätze in der Kombination aus dataset, year und geodata_level"
      - name: distinct_geodata_nuts
        description: "Anzahl unterschiedlicher geodata_id_nuts"
      - name: distinct_geodata_lau
        description: "Anzahl unterschiedlicher geodata_id_lau"
      - name: distinct_geodata_ars
        description: "Anzahl unterschiedlicher geodata_id_ars"

  - name: mart_nuts3_sociodata_harmonized
    description: >
      Sozioökonomische Kreis-Datensätze, umgerechnet auf mehrere gemeinsame
      NUTS-3-Zielversionen gleichzeitig (target_version), über den
      bevölkerungsgewichteten Crosswalk aus mart_nuts_version_crosswalk.
      Siehe Kommentar in mart_nuts3_sociodata_harmonized.sql für Details und
      die Liste der unterstützten Zielversionen.
    columns:
      - name: dataset_slug
        description: "Dataset-Slug (z.B. bevoelkerung, schuldnerquote)"
        tests:
          - not_null
      - name: target_nuts_id
        description: "NUTS-3-Code der Zielregion in der jeweiligen target_version"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: target_version
        description: "NUTS-3-Zielversion dieser Zeile (2003, 2006, 2010, 2013, 2016, 2021 oder 2024)"
        tests:
          - not_null
      - name: harmonized_value
        description: "Wert, umgerechnet auf target_version (bei Zusammenlegungen anteilig aufsummiert über mehrere Quellregionen)"
        tests:
          - not_null
      - name: is_crosswalked
        description: "true = Wert wurde über eine Versionsgrenze umgerechnet, false = geodata_year der Quelle entsprach bereits target_version"
        tests:
          - not_null
      - name: source_version
        description: "Ursprüngliche NUTS-3-Version der Quelldaten (geodata_year); bei Zusammenlegungen die kleinste beteiligte Quellversion"
      - name: n_hops
        description: "Anzahl Crosswalk-Hops zwischen source_version und target_version (0 = kein Crosswalk nötig)"

  - name: mart_nuts3_timeseries_interpolated
    description: >
      Lückenlose Zeitreihen je (NUTS-3-Region, Dataset, target_version) mit
      zwei alternativen Imputationsmethoden für fehlende Jahre: lineare
      Interpolation (Methode 1, value_linear) und peer-basierte
      Fortschreibung über den Durchschnitt der relativen Veränderung anderer
      Regionen derselben NUTS-2-Gruppe (Methode 3, value_peer_trend). Kein
      Extrapolieren über den bekannten Jahresbereich hinaus. Siehe Kommentar
      in mart_nuts3_timeseries_interpolated.sql und docs/pipeline/dbt.md für
      Details und Evaluationsergebnisse.
    columns:
      - name: nuts3_id
        description: "NUTS-3-Code der Zielregion (harmonisierte Zielversion, siehe mart_nuts3_sociodata_harmonized)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Dataset-Slug (z.B. bevoelkerung, schuldnerquote)"
        tests:
          - not_null
      - name: target_version
        description: "NUTS-3-Zielversion dieser Zeile (2003, 2006, 2010, 2013, 2016, 2021 oder 2024) - Gap-Filling läuft je Zielversion unabhängig"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: value
        description: "Ausgabewert: Originalwert falls vorhanden, sonst die lineare Interpolation (Methode 1). Aus Gründen der Abwärtskompatibilität immer befüllt (kein Extrapolieren, daher keine Randjahre außerhalb der bekannten Spanne)."
        tests:
          - not_null
      - name: is_interpolated
        description: "true = Wert wurde imputiert (kein Originalwert vorhanden), false = Originalwert aus mart_nuts3_sociodata_harmonized"
        tests:
          - not_null
      - name: value_linear
        description: "Methode-1-Schätzung (lineare Interpolation zwischen letztem bekannten Vor- und nächstem bekannten Nachjahr). Nur befüllt wenn is_interpolated = true, sonst NULL."
      - name: value_peer_trend
        description: "Methode-3-Schätzung (Fortschreibung des Vorjahreswerts mit der durchschnittlichen relativen Veränderung anderer Regionen derselben NUTS-2-Gruppe). Nur befüllt wenn is_interpolated = true UND sowohl der eigene Vorjahreswert als auch mindestens ein Peer-Wert bekannt sind, sonst NULL."
      - name: n_peer_regions
        description: "Anzahl der Peer-Regionen (gleiche NUTS-2-Gruppe), die zur Berechnung von value_peer_trend beigetragen haben. NULL wenn is_interpolated = false oder value_peer_trend nicht berechenbar war."

  - name: mart_lau_sociodata_harmonized
    description: >
      LAU-Pendant zu mart_nuts3_sociodata_harmonized: sozioökonomische
      Gemeinde(LAU)-Datensätze, umgerechnet auf mehrere gemeinsame
      LAU-Zielversionen gleichzeitig (target_version), über den
      Crosswalk aus mart_lau_version_crosswalk. Siehe Kommentar in
      mart_lau_sociodata_harmonized.sql für Details, measure_type-
      Aggregationslogik und die Liste der unterstützten Zielversionen.
    columns:
      - name: dataset_slug
        description: "Dataset-Slug (z.B. beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: target_gisco_id
        description: "GISCO-ID der Zielregion in der jeweiligen target_version"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: target_version
        description: "LAU-Zielversion dieser Zeile (2011-2024)"
        tests:
          - not_null
      - name: harmonized_value
        description: "Wert, umgerechnet auf target_version - je measure_type entweder anteilig aufsummiert ('sum') oder gewichtet gemittelt ('weighted_avg') über mehrere Quellregionen"
        tests:
          - not_null
      - name: is_crosswalked
        description: "true = Wert wurde über eine Versionsgrenze umgerechnet, false = geodata_year der Quelle entsprach bereits target_version"
        tests:
          - not_null
      - name: source_version
        description: "Ursprüngliche LAU-Version der Quelldaten (geodata_year); bei Zusammenlegungen die kleinste beteiligte Quellversion"
      - name: n_hops
        description: "0 = kein Crosswalk nötig, 1 = über mart_lau_version_crosswalk umgerechnet"

  - name: mart_lau_timeseries_interpolated
    description: >
      LAU-Pendant zu mart_nuts3_timeseries_interpolated: lückenlose
      Zeitreihen je (Gemeinde, Dataset, target_version) mit denselben zwei
      Imputationsmethoden (linear / peer_trend), aber mit dem Kreis (erste
      5 Stellen des Amtlichen Gemeindeschlüssels) statt der NUTS-2-Gruppe
      als Peer-Gruppe. Siehe Kommentar in mart_lau_timeseries_interpolated.sql.
    columns:
      - name: gisco_id
        description: "GISCO-ID der Zielregion (harmonisierte Zielversion, siehe mart_lau_sociodata_harmonized)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Dataset-Slug (z.B. beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: target_version
        description: "LAU-Zielversion dieser Zeile (2011-2024) - Gap-Filling läuft je Zielversion unabhängig"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: value
        description: "Ausgabewert: Originalwert falls vorhanden, sonst die lineare Interpolation (Methode 1)."
        tests:
          - not_null
      - name: is_interpolated
        description: "true = Wert wurde imputiert (kein Originalwert vorhanden), false = Originalwert aus mart_lau_sociodata_harmonized"
        tests:
          - not_null
      - name: value_linear
        description: "Methode-1-Schätzung (lineare Interpolation). Nur befüllt wenn is_interpolated = true, sonst NULL."
      - name: value_peer_trend
        description: "Methode-3-Schätzung (Fortschreibung mit der durchschnittlichen relativen Veränderung anderer Gemeinden desselben Kreises). Nur befüllt wenn is_interpolated = true UND sowohl der eigene Vorjahreswert als auch mindestens ein Peer-Wert bekannt sind, sonst NULL."
      - name: n_peer_regions
        description: "Anzahl der Peer-Gemeinden (gleicher Kreis), die zur Berechnung von value_peer_trend beigetragen haben. NULL wenn is_interpolated = false oder value_peer_trend nicht berechenbar war."
