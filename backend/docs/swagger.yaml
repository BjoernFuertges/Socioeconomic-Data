info:
  contact:
    email: Socioeconomic-Data@b.sgtrf.de
    name: API Support
  description: REST-API für LAU-Geodaten und Arbeitslosenzahlen aus dbt-transformierten
    Daten
  termsOfService: http://swagger.io/terms/
  title: Sozioökonomische Daten API
  version: dev
paths:
  /agenturbezirke:
    get:
      consumes:
      - application/json
      description: Gibt alle Agenturbezirke mit Geometrie zurück. Agenturbezirke sind
        eine eigenständige Gebietsgliederung, nicht deckungsgleich mit NUTS-3/LAU/ARS.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturbezirkSummary'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Liste aller Agenturbezirke
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}:
    get:
      consumes:
      - application/json
      description: Gibt Details eines Agenturbezirks mit Geometrie zurück
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AgenturbezirkSummary'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Agenturbezirk-Details
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/arbeitslosigkeit:
    get:
      consumes:
      - application/json
      description: Gibt die monatliche Zeitreihe (Arbeitslose, Unterbeschäftigung)
        für einen Agenturbezirk zurück (AfA Lange Zeitreihen, ab Januar 2007)
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturbezirkArbeitslosigkeitPoint'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Monatliche Arbeitslosenzahlen eines Agenturbezirks
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/dataset-aggregate/{slug}:
    get:
      consumes:
      - application/json
      description: 'Aggregiert einen Kreis-grain-Soziodata-Datensatz (siehe GET /nuts/{nuts_id}/datasets)
        über den Agentur<->NUTS-3-Flächenanteils-Crosswalk auf Agenturbezirk-Ebene
        hoch (Summe bzw. bevölkerungsgewichteter Durchschnitt je nach Datensatz, siehe
        mart_agentur_dataset_aggregate). Analog zu GET /nuts/{nuts_id}/dataset-aggregate/{slug}
        für NUTS-0/1/2. LIMITATIONEN: Summen (Zählgrößen) sind Summen der Kreis-Werte;
        Quoten und Durchschnitte sind ein bevölkerungsgewichteter Durchschnitt der
        Kreis-Werte (Rückfall auf Flächengewichte, wenn Bevölkerungszahlen fehlen)
        - eine Näherung, keine exakte Neuberechnung, da Zähler/Nenner nicht vorliegen
        und die Gesamtbevölkerung nur Ersatz für die eigentliche Bezugsgröße ist.
        Mediane lassen sich nicht aus Kreis-Medianen zusammensetzen (nur Schätzung).
        Berlin: ein Kreis verteilt sich auf drei Agenturbezirke, Summen werden flächenanteilig
        aufgeteilt. Pro Punkt kennzeichnen aggregation_method und value_kind das Verfahren.'
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      - description: Route-Slug des Datensatzes
        example: bevoelkerung
        in: path
        name: slug
        required: true
        type: string
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturDatasetAggregatePoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Auf Agenturbezirk-Ebene aggregierte Datensatz-Zeitreihe
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/nuts-hierarchy:
    get:
      consumes:
      - application/json
      description: Gibt alle überlappenden NUTS-1/2/3-Regionen eines Agenturbezirks
        zurück. is_fully_contained markiert Regionen, die den Agenturbezirk vollständig
        enthalten (Flächenanteil >= 99 %); is_parent die kleinste davon (übergeordnete
        Region). Reicht ein Agenturbezirk über Bundeslandgrenzen hinaus, ist keine
        Zeile is_parent. Räumliche Schätzung, keine amtliche Zuordnung.
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturNutsMembership'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: NUTS-Hierarchie eines Agenturbezirks (Kreis/Regierungsbezirk/Bundesland)
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/nuts3:
    get:
      consumes:
      - application/json
      description: 'Gibt die überlappenden NUTS-3-Regionen eines Agenturbezirks zurück,
        mit Flächenanteil in beide Richtungen. Agenturbezirke bestehen i.d.R. aus
        einem oder mehreren ganzen Kreisen (Ausnahme Berlin: 3 Agenturbezirke teilen
        sich einen Kreis) - eine räumliche Schätzung, keine amtliche Zuordnung.'
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturNuts3Share'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: NUTS-3-Zuordnung eines Agenturbezirks (Flächenanteile)
      tags:
      - Agenturbezirke
  /agenturbezirke/dataset-aggregate:
    get:
      consumes:
      - application/json
      description: Gibt alle (Datensatz-Slug, Jahr)-Kombinationen zurück, für die
        mart_agentur_dataset_aggregate Werte enthält - Grundlage der Datensatz-/Jahresauswahl
        in der Karte.
      parameters:
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturDatasetAggregateYear'
                  type: array
              type: object
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verfügbare aggregierte Datensätze/Jahre (Agenturbezirke)
      tags:
      - Agenturbezirke
  /agenturbezirke/dataset-aggregate/{slug}:
    get:
      consumes:
      - application/json
      description: 'Liefert für einen Kreis-grain-Datensatz und ein Jahr den auf Agenturbezirk-Ebene
        aggregierten Wert je Agenturbezirk (siehe mart_agentur_dataset_aggregate)
        - für die Kartendarstellung. Geometrien kommen weiterhin aus GET /agenturbezirke/period.
        LIMITATIONEN: Summen (Zählgrößen) sind Summen der Kreis-Werte; Quoten und
        Durchschnitte sind ein bevölkerungsgewichteter Durchschnitt der Kreis-Werte
        (Rückfall auf Flächengewichte, wenn Bevölkerungszahlen fehlen) - eine Näherung,
        keine exakte Neuberechnung, da Zähler/Nenner nicht vorliegen und die Gesamtbevölkerung
        nur Ersatz für die eigentliche Bezugsgröße ist. Mediane lassen sich nicht
        aus Kreis-Medianen zusammensetzen (nur Schätzung). Berlin: ein Kreis verteilt
        sich auf drei Agenturbezirke, Summen werden flächenanteilig aufgeteilt. Pro
        Punkt kennzeichnen aggregation_method und value_kind das Verfahren.'
      parameters:
      - description: Route-Slug des Datensatzes
        example: bevoelkerung
        in: path
        name: slug
        required: true
        type: string
      - description: Jahr
        example: 2022
        in: query
        name: year
        required: true
        type: integer
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturDatasetAggregatePoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Aggregierter Datensatz für alle Agenturbezirke (ein Jahr)
      tags:
      - Agenturbezirke
  /agenturbezirke/latest:
    get:
      consumes:
      - application/json
      description: Gibt jeden Agenturbezirk mit Geometrie und dem jeweils neuesten
        verfügbaren Monatswert (Arbeitslose, Unterbeschäftigung) zurück.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturbezirkLatestValue'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Agenturbezirke mit neuestem Berichtsmonat (für die Karte)
      tags:
      - Agenturbezirke
  /agenturbezirke/period:
    get:
      consumes:
      - application/json
      description: Gibt jeden Agenturbezirk mit Geometrie und dem Monatswert (Arbeitslose,
        Unterbeschäftigung) für das angegebene Jahr/Monat zurück.
      parameters:
      - description: Jahr
        example: 2026
        in: query
        name: year
        required: true
        type: integer
      - description: Monat (1-12)
        example: 8
        in: query
        name: month
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturbezirkLatestValue'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Agenturbezirke zu einem gewählten Berichtsmonat (für die Karte)
      tags:
      - Agenturbezirke
  /agenturbezirke/periods:
    get:
      consumes:
      - application/json
      description: Gibt alle distinkten (Jahr, Monat)-Kombinationen zurück, für die
        Arbeitslosenzahlen vorliegen (neueste zuerst).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AgenturbezirkPeriod'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verfügbare Berichtsmonate der Agenturbezirke
      tags:
      - Agenturbezirke
  /arbeitslose:
    get:
      consumes:
      - application/json
      description: Staging-Modell für Arbeitslosenzahlen je Kreis – bereinigt, mit
        Datumsableitung und Qualitätsflag
      parameters:
      - description: NUTS-3-Code der Region
        example: DEF01
        in: query
        name: geodata_id_nuts
        type: string
      - description: NUTS-Präfix für Hierarchieabfragen (z.B. DE1)
        example: DE1
        in: query
        name: nuts_parent_id
        type: string
      - description: Teilstring-Suche nach Gebietsnamen
        example: stuttgart
        in: query
        name: geodata_name_contains
        type: string
      - description: Jahr der Beobachtung (1990-2030)
        example: 2020
        in: query
        name: year
        type: integer
      - description: Nur Jahre >= from_year zurückgeben
        example: 2018
        in: query
        name: from_year
        type: integer
      - description: Nur Jahre <= to_year zurückgeben
        example: 2022
        in: query
        name: to_year
        type: integer
      - description: Punktabfrage im Format lon,lat (WGS84)
        example: 13.404954,52.520008
        in: query
        name: point
        type: string
      - default: 1000
        description: Anzahl der Ergebnisse (1-10000)
        example: 100
        in: query
        name: limit
