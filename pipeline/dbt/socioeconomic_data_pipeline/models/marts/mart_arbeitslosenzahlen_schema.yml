version: 2

models:
  - name: mart_arbeitslosenzahlen
    description: "Final mart for unemployment data with enrichments, deduplication, and quality checks"
    tests:
      # Test for duplicate records
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - geodata_id
            - observation_date
            
    columns:
      - name: dataset_id
        description: "Unique identifier linking to metadata"
        data_type: text
        tests:
          - not_null
          
      - name: geodata_id
        description: "Mapped geodata ID (LAU/NUTS code)"
        data_type: text
        tests:
          - not_null
          
      - name: geodata_name
        description: "Mapped geodata name"
        data_type: text
        tests:
          - not_null
          
      - name: year
        description: "Year of observation"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1990
              max_value: 2030
              
      - name: month
        description: "Month of observation (null for yearly data)"
        data_type: integer
        
      - name: quarter
        description: "Quarter of the year (1-4) for monthly data"
        data_type: integer
        
      - name: observation_date
        description: "Date of observation"
        data_type: date
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= '1990-01-01'"
          - dbt_utils.expression_is_true:
              expression: "<= current_date"
              
      - name: time_type
        description: "Type of time data"
        data_type: text
        tests:
          - not_null
          - accepted_values:
              values: ['yearly', 'monthly']
              
      - name: arbeitslose
        description: "Number of unemployed persons"
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
                
      - name: load_date
        description: "Date when the data was originally loaded"
        data_type: text
        
      - name: dataset_title
        description: "Title of the dataset"
        data_type: text
        
      - name: dataset_series
        description: "Series name of the dataset"
        data_type: text
        
      - name: source_url
        description: "URL of the data source"
        data_type: text
        
      - name: geodata_level
        description: "Level of geodata (e.g., NUTS 3)"
        data_type: text
        tests:
          - not_null
          
      - name: arbeitslose_previous_year
        description: "Number of unemployed persons in previous year"
        data_type: numeric
        
      - name: yoy_change_percent
        description: "Year-over-year change percentage"
        data_type: numeric
        tests:
          # Warn if change is more than 500% (likely data quality issue)
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 500
              config:
                severity: warn
                where: "yoy_change_percent is not null"
                
      - name: data_quality_flag
        description: "Data quality flag - only VALID records in final table"
        data_type: text
        tests:
          - accepted_values:
              values: ['VALID']
