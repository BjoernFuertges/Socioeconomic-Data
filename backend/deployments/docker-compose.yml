services:
  traefik:
    image: traefik:v3.6.5
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le_http.acme.httpchallenge=true"
      - "--certificatesresolvers.le_http.acme.email=${LE_EMAIL}"
      - "--certificatesresolvers.le_http.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le_http.acme.httpchallenge.entrypoint=web"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - backend-net

  postgis:
    image: postgis/postgis:17-3.5
    container_name: postgis
    environment:
      POSTGRES_DB: soziooekonomische-daten
      POSTGRES_USER: sozio_data_compose_user
      POSTGRES_PASSWORD: REMOVED_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

  backend:
    image: ${DOCKER_HUB_USERNAME}/backend:latest
    container_name: backend
    env_file: ".env.backend"
    environment:
      PORT: 8080
      API_HOST: 0.0.0.0
      SWAGGER_HOST: fp-icw-soziooekonomische-daten.f4.htw-berlin.de
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: sozio_data_compose_user
      DB_PASSWORD: REMOVED_PASSWORD
      DB_NAME: soziooekonomische-daten
    restart: always
    depends_on:
      - postgis
      - traefik
    networks:
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`fp-icw-soziooekonomische-daten.f4.htw-berlin.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=le_http"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  pipeline:
    image: python:3.12-slim
    container_name: pipeline
    working_dir: /app
    restart: always
    volumes:
      - ../../dlt:/app/dlt
      - ../../dbt:/app/dbt
      - ../../geo-mapper/scripts:/app/geo-mapper-scripts:ro
      - ../../data-exchange:/app/data-exchange:rw
      - ../../socioeconomic-data-parser:/app/socioeconomic-data-parser:ro
    environment:
      DATA_EXCHANGE_PATH: /app/data-exchange/1_friedrich-bjoern
      GEODATA_BASE_PATH: /app/socioeconomic-data-parser
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: sozio_data_compose_user
      DB_PASSWORD: REMOVED_PASSWORD
      DB_NAME: soziooekonomische-daten
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgis
      DESTINATION__POSTGRES__CREDENTIALS__PORT: 5432
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: soziooekonomische-daten
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: sozio_data_compose_user
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: REMOVED_PASSWORD
      DBT_PROFILES_DIR: /app/dbt/socioeconomic_data_pipeline
    command: >
      bash -c "python -m pip install -q -r /app/dlt/requirements.txt 'dlt[postgres]' dbt-postgres geo-mapper-htw==0.1.0b10 && python -c 'import dlt, pandas, shapely' && echo 'Pipeline image ready' && tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import dlt, pandas, shapely'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      - postgis
    networks:
      - backend-net
    labels:
      ofelia.enabled: "true"
      # dlt + dbt jede Stunde zur vollen Stunde
      ofelia.job-exec.pipeline.schedule: "0 0 * * * *"
      ofelia.job-exec.pipeline.command: "bash /app/dlt/run_all_pipelines.sh"

      # geo-mapper runs every hour at minute 15
      ofelia.job-exec.geo-mapper.schedule: "0 15 * * * *"
      ofelia.job-exec.geo-mapper.command: >
        bash -c "bash /app/geo-mapper-scripts/run_geo_mapper.sh"

  scheduler:
    image: mcuadros/ofelia:0.3.21
    container_name: scheduler
    restart: always
    command: daemon --docker
    depends_on:
      pipeline:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-net

  adminer:
    image: adminer
    restart: always
    command: php -S 0.0.0.0:8080 -t /var/www/html
    environment:
      ADMINER_DEFAULT_SERVER: postgis
    depends_on:
      - traefik
    networks:
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`${ADMINER_HOST:-fp-icw-soziooekonomische-daten.f4.htw-berlin.de}`) && PathPrefix(`/adminer/`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.tls.certresolver=le_http"
      - "traefik.http.routers.adminer.priority=90"
      - "traefik.http.routers.adminer.middlewares=adminer-strip-prefix@docker"
      - "traefik.http.middlewares.adminer-strip-prefix.stripprefix.prefixes=/adminer"
      - "traefik.http.routers.adminer-slash.rule=Host(`${ADMINER_HOST:-fp-icw-soziooekonomische-daten.f4.htw-berlin.de}`) && Path(`/adminer`)"
      - "traefik.http.routers.adminer-slash.entrypoints=websecure"
      - "traefik.http.routers.adminer-slash.tls=true"
      - "traefik.http.routers.adminer-slash.tls.certresolver=le_http"
      - "traefik.http.routers.adminer-slash.priority=91"
      - "traefik.http.routers.adminer-slash.middlewares=adminer-add-trailing-slash@docker"
      - "traefik.http.middlewares.adminer-add-trailing-slash.redirectregex.regex=^https?://([^/]+)/adminer$"
      - "traefik.http.middlewares.adminer-add-trailing-slash.redirectregex.replacement=https://$${1}/adminer/"
      - "traefik.http.middlewares.adminer-add-trailing-slash.redirectregex.permanent=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  frontend:
    image: ${DOCKER_HUB_USERNAME}/soziodata-frontend:latest
    container_name: frontend
    restart: always
    depends_on:
      - traefik
    networks:
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`fp-icw-soziooekonomische-daten.f4.htw-berlin.de`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le_http"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  docs:
    image: ${DOCKER_HUB_USERNAME}/soziodata-docs:latest
    container_name: docs
    restart: always
    depends_on:
      - traefik
    networks:
      - backend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`fp-icw-soziooekonomische-daten.f4.htw-berlin.de`) && PathPrefix(`/docs/`)"
      - "traefik.http.routers.docs.entrypoints=websecure"
      - "traefik.http.routers.docs.tls=true"
      - "traefik.http.routers.docs.tls.certresolver=le_http"
      - "traefik.http.routers.docs.priority=90"
      - "traefik.http.routers.docs.middlewares=docs-strip-prefix@docker"
      - "traefik.http.middlewares.docs-strip-prefix.stripprefix.prefixes=/docs"
      - "traefik.http.routers.docs-slash.rule=Host(`fp-icw-soziooekonomische-daten.f4.htw-berlin.de`) && Path(`/docs`)"
      - "traefik.http.routers.docs-slash.entrypoints=websecure"
      - "traefik.http.routers.docs-slash.tls=true"
      - "traefik.http.routers.docs-slash.tls.certresolver=le_http"
      - "traefik.http.routers.docs-slash.priority=91"
      - "traefik.http.routers.docs-slash.middlewares=docs-add-trailing-slash@docker"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.regex=^https?://([^/]+)/docs$$"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.replacement=https://$${1}/docs/"
      - "traefik.http.middlewares.docs-add-trailing-slash.redirectregex.permanent=true"
      - "traefik.http.services.docs.loadbalancer.server.port=80"

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge