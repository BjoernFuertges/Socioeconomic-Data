version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/web/app
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /pipeline/dlt
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend/web/app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /backend/deployments
    schedule:
      interval: weekly
    ignore:
      # Major PostgreSQL upgrades need a pg_upgrade/dump+restore of the data
      # directory (a new image cannot start on an old PGDATA); do them by hand.
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]
      # Traefik majors change label/CLI syntax (v2 -> v3); migrate deliberately.
      - dependency-name: "traefik"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra/hetzner
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ssh-setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
