  github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.DatasetYearMetrics:
    properties:
      excluded_invalid_count:
        description: |-
          ExcludedInvalidCount is the number of region values of this year left
          out as invalid (has_valid_value = false, missing value; for derived
          metrics: numerator, denominator or factor invalid, or a zero
          denominator of a ratio; a zero factor of a product is valid).
        example: 2
        type: integer
      max:
        example: 42.7
        type: number
      mean:
        example: 12.3
        type: number
      median:
        example: 11.8
        type: number
      min:
        example: 1.2
        type: number
      region_count:
        example: 400
        type: integer
      regional_rank:
        example: 142
        type: integer
      regional_rank_total:
        example: 400
        type: integer
      regional_value:
        example: 9.4
        type: number
      regions_without_denominator:
        description: |-
          RegionsWithoutDenominator (derived metrics with a dataset denominator
          only) counts regions of this year without a denominator value.
