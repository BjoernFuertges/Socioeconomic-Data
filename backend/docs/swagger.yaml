        NUTS-Region zurück. Das NUTS-Level wird automatisch anhand der Code-Länge
        erkannt: 2 Zeichen = NUTS-0 (Land), 3 = NUTS-1 (Bundesland), 4 = NUTS-2 (Regierungsbezirk),
        5 = NUTS-3 (Kreis). Standard: neuestes verfügbares Jahr. Mit ?all=true: Zeitreihe
        aller Jahre. Mit ?year=YYYY: bestimmtes Jahr. Mit ?part=metadata werden nur
        Geo-Metadaten zurückgegeben, mit ?part=socioeconomic nur die sozioökonomischen
