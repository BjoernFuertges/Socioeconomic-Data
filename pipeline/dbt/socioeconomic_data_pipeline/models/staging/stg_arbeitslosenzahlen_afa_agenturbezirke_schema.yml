version: 2

models:
  - name: stg_arbeitslosenzahlen_afa_agenturbezirke
    description: "Staging model for monthly unemployment and underemployment counts per employment agency district (AfA long time series)."
    columns:
      - name: arbeitslosenzahlen_afa_pk
        description: "Surrogate key built from geodata_id_agentur, year and month"
        data_type: text
        tests:
          - unique
          - not_null

      - name: geodata_id_agentur
        description: "Official BA key of the employment agency district"
        data_type: text
        tests:
          - not_null
          - relationships:
              to: ref('stg_agenturbezirk_geometry')
              field: ba_schl

      - name: geodata_name
        description: "Name of the employment agency district"
        data_type: text

      - name: year
        description: "Year of the reporting month"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2007
              max_value: 2100

      - name: month
        description: "Month of the reporting period (1-12)"
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 12

      - name: arbeitslose
        description: "Number of unemployed persons in the reporting month; null if statistically suppressed"
        data_type: numeric
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                where: "arbeitslose is not null"

      - name: unterbeschaeftigung
        description: "Underemployment (excluding short-time work) in the reporting month; null if statistically suppressed"
        data_type: numeric
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                where: "unterbeschaeftigung is not null"

      - name: observation_date
        description: "Observation date (1st of the reporting month)"
        data_type: date
        tests:
          - not_null
