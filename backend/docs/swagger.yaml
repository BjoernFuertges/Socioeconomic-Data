  models.DatasetCatalogEintrag:
    properties:
      algorithm:
        type: string
      dataset_slug:
        example: bevoelkerung
        type: string
      dataset_uri:
        description: |-
          DatasetURI ist eine persistente, deterministisch aus DatasetSlug abgeleitete
          Kennung (urn:soziodata:dataset:<slug>) - keine künstliche Zufalls-ID.
        example: urn:soziodata:dataset:bevoelkerung
        type: string
      description:
        example: Zahl der Erwerbstätigen in 1000 Personen
        type: string
      description_long:
        type: string
      geodata_level:
        example: NUTS_3
        type: string
      geodata_year:
        example: 2024
        type: integer
      license:
        example: unbekannt
        type: string
      license_backfilled:
        description: |-
          LicenseBackfilled ist true, wenn der Datensatz Jahre vor LicenseTrackedSince
          enthält - die aktuelle Lizenz wurde dann rückwirkend auf diese älteren Jahre
          angewendet, ohne für sie unabhängig verifiziert zu sein.
        example: true
        type: boolean
      license_tracked_since:
        description: |-
          LicenseTrackedSince ist das Datum, seit dem die Lizenz dieses Datensatzes
          per snap_dataset_license beobachtet wird; null falls noch kein dbt snapshot
          gelaufen ist.
        example: "2026-09-11"
        type: string
      license_url:
        type: string
      max_year:
        example: 2023
        type: integer
      min_year:
        example: 1995
        type: integer
      name:
        example: Bevölkerung
        type: string
      number_type:
        example: absolute
        type: string
      provenance:
        example: Laufende Raumbeobachtung des BBSR; Fortschreibung des Bevölkerungsstandes
        type: string
      total_records:
        example: 11600
        type: integer
      unit:
        example: Einwohner
        type: string
      updated_at:
        type: string
    type: object
