version: 2

models:

  - name: stg_sgb_ii_quote_kreise
    description: Cleaned SGB II quota per district (Kreis), with derived observation date and quality flag.
    columns:
      - name: sgb_ii_quote_pk
        description: Surrogate key built from geodata_id_nuts and year
        data_type: text
        tests:
          - unique
          - not_null
      - name: original_id_1
        description: Official regional key from the source file
        data_type: text
        tests:
          - not_null
      - name: original_name
        description: Region name from the source file
        data_type: text
        tests:
          - not_null
      - name: geodata_name
        description: Mapped geodata name
        data_type: text
      - name: geodata_id_nuts
        description: NUTS-3 code of the region
        data_type: text
        tests:
          - not_null
      - name: geodata_id_ars
        description: Official regional key (ARS) after mapping
        data_type: text
      - name: mapper
        description: Mapping method
        data_type: text
      - name: parameter
        description: Mapping parameter
        data_type: text
      - name: geodata_level
        description: Geodata level (NUTS_3)
        data_type: text
      - name: geodata_year
        description: Reference year of the geodata
        data_type: integer
      - name: year
        description: Year of observation
        data_type: integer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 2005
              max_value: 2030
      - name: sgb_ii_quote_prozent
        description: Share of SGB II benefit recipients in the population, in percent
        data_type: numeric
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: observation_date
        description: Observation date (1 January of the year)
        data_type: date
        tests:
          - not_null
      - name: has_valid_value
        description: True if the SGB II quota is plausible (0-100 %)
        data_type: boolean
