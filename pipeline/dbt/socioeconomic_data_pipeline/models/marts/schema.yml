version: 2

models:
  - name: mart_region_datasets
    description: "Precomputed index of available (geodata_id_nuts, dataset_slug, year) combinations across all datasets."
    columns:
      - name: geodata_id_nuts
        description: "NUTS code of the region (e.g. DEF01)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Dataset slug, matches the route slug of the API (e.g. bevoelkerung)"
        tests:
          - not_null
      - name: year
        description: "Year of data"
        tests:
          - not_null

  - name: lau_integrated
    description: "Integrated LAU dataset combining geometry and population data for all available years."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO (Eurostat)"
        tests:
          - not_null
      - name: year
        description: "Year of data"
        tests:
          - not_null
      - name: lau_name_national
        description: "LAU name in national language"
      - name: lau_name_latin
        description: "LAU name in Latin characters"
      - name: country_code
        description: "Country code (2-letter ISO)"
        tests:
          - not_null
      - name: nuts_3_code
        description: "NUTS-3 code as declared by the population source (may be empty; see nuts3_id for the canonical parent)"
      - name: nuts3_id
        description: "Canonical NUTS-3 parent: the declared source column if present, otherwise a spatial estimate (largest area overlap with the current NUTS-3 version)"
      - name: nuts3_link_source
        description: "'declared' (from source data) or 'spatial_estimate' (estimated spatially, not an official assignment)"
      - name: geometry_3035
        description: "Geometry (polygon) in EPSG:3035"
      - name: population_count
        description: "Population count for the year"
      - name: missing_population_data
        description: "True if population data is missing for this LAU and year"
      - name: year_match
        description: "True if geometry and population year match"
      - name: total_years_available
        description: "Total number of years available for this LAU"
      - name: years_with_population
        description: "Number of years with population data for this LAU"

  - name: mart_nuts3_summary
    description: "All available socioeconomic indicators per NUTS-3 region and year."
    columns:
      - name: nuts_id
        description: "NUTS-3 code of the region (e.g. DE111)"
        tests:
          - not_null
      - name: region_name
        description: "Region name"
      - name: year
        description: "Year of data"
        tests:
          - not_null
      - name: bevoelkerung
        description: "Population count (null if no data for this year)"
      - name: schuldnerquote_prozent
        description: "Debtor quota in percent (null if no data for this year)"
      - name: arbeitslose_kreise
        description: "Unemployment count per district (INKAR/BBSR, annual average). For employment agency district figures (monthly, AfA) see mart_agenturbezirk_sociodata; these use a different, non-congruent district structure."
      - name: arbeitslose
        description: "Alias of arbeitslose_kreise, provided under this name so the column is consistent across all four NUTS levels."
      - name: yoy_change_percent
        description: "Percentage change of arbeitslose compared with the previous year of the same region (null without a previous-year value)"

  - name: lau_data_quality
    description: "Data quality metrics and issue tracking for the LAU integration."
    columns:
      - name: report_type
        description: "Type of report: summary, missing_data, or year_mismatch"
        tests:
          - not_null
          - accepted_values:
              values: ['summary', 'missing_data', 'year_mismatch']
      - name: year
        description: "Year of data"
        tests:
          - not_null
      - name: population_coverage_percent
        description: "Percentage of LAUs with population data for the year"
      - name: issue_type
        description: "Description of the data quality issue"

  - name: mart_nuts_geometry_historized
    description: "Historised NUTS geometries: one row per region and geometry period. Vintages with identical geometry are merged."
    columns:
      - name: nuts_id
        description: "NUTS code of the region (e.g. DE111)"
        tests:
          - not_null
      - name: levl_code
        description: "NUTS level (0-3)"
      - name: country_code
        description: "Country code (2-letter ISO)"
      - name: region_name
        description: "Region name"
      - name: valid_from
        description: "First vintage year in which this geometry version appears"
        tests:
          - not_null
      - name: valid_to
        description: "Last year in which this version was valid; null = still current"
      - name: max_vintage_year
        description: "Last vintage year in which this geometry version was available"
      - name: geometry_3035
        description: "Geometry in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "Geometry in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "True if geometry_3035 is not null and not empty"

  - name: mart_lau_geometry_historized
    description: "Historised LAU geometries (Local Administrative Units): one row per LAU unit and geometry period. Vintages with identical geometry are merged."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO (Eurostat)"
        tests:
          - not_null
      - name: country_code
        description: "Country code (2-letter ISO)"
      - name: lau_id
        description: "National LAU identifier"
      - name: lau_name
        description: "Name of the LAU unit"
      - name: nuts_3
        description: "NUTS-3 code of the parent region (nullable)"
      - name: valid_from
        description: "First vintage year in which this geometry version appears"
        tests:
          - not_null
      - name: valid_to
        description: "Last year in which this version was valid; null = still current"
      - name: max_vintage_year
        description: "Last vintage year in which this geometry version was available"
      - name: geometry_3035
        description: "Geometry in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "Geometry in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "True if geometry_3035 is not null and not empty"

  - name: mart_socioeconomic_inventory
    description: "Pre-aggregated inventory of the available socioeconomic data per dataset, year and geodata level."
    columns:
      - name: dataset
        description: "Dataset slug (API route, e.g. arbeitslose or beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: geodata_level
        description: "Geodata level (e.g. NUTS_3, LAU)"
        tests:
          - not_null
      - name: records
        description: "Number of records for the combination of dataset, year and geodata_level"
      - name: distinct_geodata_nuts
        description: "Number of distinct geodata_id_nuts"
      - name: distinct_geodata_lau
        description: "Number of distinct geodata_id_lau"
      - name: distinct_geodata_ars
        description: "Number of distinct geodata_id_ars"

  - name: mart_dataset_source
    description: "Source values of the generic Kreis/Gemeinden datasets in long format, as delivered by the geo-mapping step (only region names mapped to geodata IDs). Unharmonised and not interpolated."
    columns:
      - name: dataset_slug
        description: "Dataset slug, same as in mart_dataset_catalog"
        tests:
          - not_null
      - name: original_id_1
        description: "Region ID from the source file"
      - name: original_name
        description: "Region name from the source file"
      - name: geodata_name
        description: "Mapped geodata name"
      - name: geodata_id_nuts
        description: "Mapped NUTS ID (reference year geodata_year)"
      - name: geodata_id_lau
        description: "Mapped LAU ID (municipality datasets only)"
      - name: geodata_id_ars
        description: "Mapped official regional key (ARS)"
      - name: mapper
        description: "Mapping method of the geo-mapping step"
      - name: parameter
        description: "Mapping parameter of the geo-mapping step"
      - name: geodata_level
        description: "Geodata level (NUTS_3, LAU, ...)"
      - name: geodata_year
        description: "Reference year of the geodata"
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: value
        description: "Unchanged source value"
        tests:
          - not_null

  - name: mart_dataset_catalog
    description: "One catalog entry per dataset with provenance, license, description and a persistent URI. Covers the generic Kreis/Gemeinden datasets and arbeitslosenzahlen-afa-agenturbezirke."
    columns:
      - name: dataset_slug
        description: "Dataset slug, same as dataset in mart_socioeconomic_inventory"
        tests:
          - unique
          - not_null
      - name: dataset_uri
        description: "Persistent URI derived from dataset_slug (urn:soziodata:dataset:<slug>)"
        tests:
          - unique
          - not_null
      - name: name
        description: "Short display name"
      - name: description
        description: "Short description"
      - name: description_long
        description: "Long-form methodological description"
      - name: unit
        description: "Unit of the value field"
      - name: provenance
        description: "Publisher and source series"
      - name: license
        description: "License; 'unbekannt' (unknown) until researched"
        tests:
          - not_null
      - name: license_url
        description: "URL to the license text; null until researched"
      - name: algorithm
        description: "Free-text note on how the value is computed or derived, if applicable"
      - name: number_type
        description: "absolute or relative"
      - name: geodata_level
        description: "Geodata level the dataset is mapped to"
      - name: geodata_year
        description: "Reference year of the geodata used for mapping"
      - name: min_year
        description: "Earliest available year of observation (from mart_socioeconomic_inventory)"
      - name: max_year
        description: "Latest available year of observation (from mart_socioeconomic_inventory)"
      - name: total_records
        description: "Total number of records across all years and geodata levels"
      - name: updated_at
        description: "Time of the last metadata update"
      - name: license_tracked_since
        description: "Date since which the license of this dataset has been tracked; null if no license snapshot has been taken yet"
      - name: license_backfilled
        description: "True if the dataset has data years before license_tracked_since. The current license was then applied to those older years retroactively, without independent verification for them."
        tests:
          - not_null

  - name: mart_nuts3_sociodata_harmonized
    description: >
      Socioeconomic Kreis (district) datasets, converted to several common
      NUTS-3 target versions at the same time (target_version), using the
      population-weighted crosswalk between NUTS boundary versions.
    columns:
      - name: dataset_slug
        description: "Dataset slug (e.g. bevoelkerung, schuldnerquote)"
        tests:
          - not_null
      - name: target_nuts_id
        description: "NUTS-3 code of the target region in the respective target_version"
        tests:
          - not_null
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: target_version
        description: "NUTS-3 target version of this row (2003, 2006, 2010, 2013, 2016, 2021 or 2024)"
        tests:
          - not_null
      - name: harmonized_value
        description: "Value converted to target_version; summed proportionally when several source regions merge into one"
        tests:
          - not_null
      - name: is_crosswalked
        description: "True if the value was converted across a boundary version; false if the source geodata_year already matched target_version"
        tests:
          - not_null
      - name: source_version
        description: "Original NUTS-3 version of the source data (geodata_year); the smallest involved source version when regions merge"
      - name: n_hops
        description: "Number of crosswalk steps between source_version and target_version (0 = no crosswalk needed)"
      - name: has_valid_value
        description: "False if any contributing source value fails the has_valid_value rule of its stg_*_kreise model (valid_when in the model); harmonized_value is still computed, consumers that need plausible values (GET /metrics) skip these rows"
        tests:
          - not_null

  - name: mart_nuts3_timeseries_interpolated
    description: >
      Gap-free time series per (NUTS-3 region, dataset, target_version). Missing
      years are filled with two alternative methods: linear interpolation
      (method 1, value_linear) and peer-based trend, applying the average
      relative change of other regions in the same NUTS-2 group (method 3,
      value_peer_trend). No extrapolation beyond the known range of years.
    columns:
      - name: nuts3_id
        description: "NUTS-3 code of the target region (harmonised target version, see mart_nuts3_sociodata_harmonized)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Dataset slug (e.g. bevoelkerung, schuldnerquote)"
        tests:
          - not_null
      - name: target_version
        description: "NUTS-3 target version of this row (2003, 2006, 2010, 2013, 2016, 2021 or 2024); gap filling runs independently per target version"
        tests:
          - not_null
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: value
        description: "Output value: the original value if available, otherwise the linear interpolation (method 1). Always populated for backward compatibility; no values outside the known year range."
        tests:
          - not_null
      - name: is_interpolated
        description: "True if the value was imputed (no original value); false if it is the original value from mart_nuts3_sociodata_harmonized"
        tests:
          - not_null
      - name: value_linear
        description: "Method 1 estimate (linear interpolation between the nearest known years before and after). Only populated if is_interpolated = true, otherwise null."
      - name: value_peer_trend
        description: "Method 3 estimate (previous year's value trended by the average relative change of other regions in the same NUTS-2 group). Only populated if is_interpolated = true and both the previous year's value and at least one peer value are known; otherwise null."
      - name: n_peer_regions
        description: "Number of peer regions (same NUTS-2 group) that contributed to value_peer_trend. Null if is_interpolated = false or value_peer_trend could not be computed."

  - name: mart_lau_sociodata_harmonized
    description: >
      LAU (municipality) counterpart of mart_nuts3_sociodata_harmonized:
      municipality datasets converted to several common LAU target versions at
      the same time (target_version), using the crosswalk between LAU versions.
    columns:
      - name: dataset_slug
        description: "Dataset slug (e.g. beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: target_gisco_id
        description: "GISCO ID of the target region in the respective target_version"
        tests:
          - not_null
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: target_version
        description: "LAU target version of this row (2011-2024)"
        tests:
          - not_null
      - name: harmonized_value
        description: "Value converted to target_version. Depending on measure_type, either summed proportionally ('sum') or averaged with weights ('weighted_avg') across several source regions."
        tests:
          - not_null
      - name: is_crosswalked
        description: "True if the value was converted across a boundary version; false if the source geodata_year already matched target_version"
        tests:
          - not_null
      - name: source_version
        description: "Original LAU version of the source data (geodata_year); the smallest involved source version when regions merge"
      - name: n_hops
        description: "0 = no crosswalk needed, 1 = converted via the LAU version crosswalk"

  - name: mart_lau_timeseries_interpolated
    description: >
      LAU (municipality) counterpart of mart_nuts3_timeseries_interpolated:
      gap-free time series per (municipality, dataset, target_version) with the
      same two imputation methods (linear / peer trend). The peer group is the
      district (first five digits of the official municipality key) instead of
      the NUTS-2 group.
    columns:
      - name: gisco_id
        description: "GISCO ID of the target region (harmonised target version, see mart_lau_sociodata_harmonized)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Dataset slug (e.g. beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: target_version
        description: "LAU target version of this row (2011-2024); gap filling runs independently per target version"
        tests:
          - not_null
      - name: year
        description: "Year of observation"
        tests:
          - not_null
      - name: value
        description: "Output value: the original value if available, otherwise the linear interpolation (method 1)."
        tests:
          - not_null
      - name: is_interpolated
        description: "True if the value was imputed (no original value); false if it is the original value from mart_lau_sociodata_harmonized"
        tests:
          - not_null
      - name: value_linear
        description: "Method 1 estimate (linear interpolation). Only populated if is_interpolated = true, otherwise null."
      - name: value_peer_trend
        description: "Method 3 estimate (previous year's value trended by the average relative change of other municipalities in the same district). Only populated if is_interpolated = true and both the previous year's value and at least one peer value are known; otherwise null."
      - name: n_peer_regions
        description: "Number of peer municipalities (same district) that contributed to value_peer_trend. Null if is_interpolated = false or value_peer_trend could not be computed."

  - name: mart_agenturbezirk_sociodata
    description: "Monthly unemployment and underemployment counts per employment agency district, joined with its boundary geometry. Employment agency districts form their own geographic structure (not NUTS-3, LAU or ARS)."
    columns:
      - name: ba_schl
        description: "Official BA key of the employment agency district"
        tests:
          - not_null
      - name: name
        description: "Name of the employment agency district"
      - name: geometry_wgs84
        description: "Geometry in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "True if a non-empty geometry is present"
      - name: valid_from
        description: "Valid-from date of the boundaries from the shapefile"
      - name: valid_to
        description: "Valid-to date of the boundaries from the shapefile"
      - name: year
        description: "Year of the reporting month (null if no values could be loaded for this district)"
      - name: month
        description: "Month of the reporting period (1-12)"
      - name: observation_date
        description: "Observation date (1st of the reporting month)"
      - name: arbeitslose
        description: "Number of unemployed persons in the reporting month; null if statistically suppressed"
      - name: unterbeschaeftigung
        description: "Underemployment (excluding short-time work) in the reporting month; null if statistically suppressed"

  - name: mart_agenturbezirk_latest
    description: "One row per employment agency district with its most recent reporting month. Intended for map display; there is no time-series or interpolation mart for employment agency districts yet."
    columns:
      - name: ba_schl
        description: "Official BA key of the employment agency district"
        tests:
          - not_null
          - unique
      - name: name
        description: "Name of the employment agency district"
      - name: geometry_wgs84
        description: "GeoJSON geometry in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "True if a non-empty geometry is present"
      - name: valid_from
        description: "Valid-from date of the boundaries from the shapefile"
      - name: valid_to
        description: "Valid-to date of the boundaries from the shapefile"
      - name: year
        description: "Year of the most recent reporting month"
        tests:
          - not_null
      - name: month
        description: "Most recent reporting month (1-12)"
      - name: observation_date
        description: "Observation date (1st of the most recent reporting month)"
      - name: arbeitslose
        description: "Number of unemployed persons in the most recent reporting month; null if statistically suppressed"
      - name: unterbeschaeftigung
        description: "Underemployment (excluding short-time work) in the most recent reporting month; null if statistically suppressed"

  - name: mart_agentur_nuts_membership
    description: "Placement of employment agency districts in the NUTS hierarchy: one row per (district, overlapping NUTS-1/2/3 region), derived from NUTS code prefixes. is_fully_contained (area share >= 99 %) marks regions that fully contain the district; is_parent marks the smallest such region. Spatial estimate, not an official assignment."
    columns:
      - name: ba_schl
        description: "Official BA key of the employment agency district"
        tests:
          - not_null
      - name: nuts_id
        description: "NUTS code (level 1, 2 or 3) of the overlapping region"
        tests:
          - not_null
      - name: nuts_level
        description: "NUTS level (1 = federal state, 2 = government district, 3 = district)"
        tests:
          - accepted_values:
              values: [1, 2, 3]
              quote: false
      - name: region_name
        description: "Name of the NUTS region (2024 vintage)"
      - name: area_share_of_agentur
        description: "Share of the district's area that lies in this region (0..1)"
      - name: is_fully_contained
        description: "True if the district lies entirely within this region (with tolerance)"
      - name: is_parent
        description: "True for the smallest NUTS level that fully contains the district; at most one row per district"

  - name: mart_agentur_nuts3_crosswalk
    description: "Many-to-many assignment between employment agency districts and NUTS-3 regions, with area shares in both directions. Districts usually consist of one or more whole districts (Kreise); exception: Berlin, where three agency districts share one Kreis. Spatial estimate by area only, not by population, not an official assignment. Complements the Kreis-level unemployment dataset."
    columns:
      - name: ba_schl
        description: "Official BA key of the employment agency district"
        tests:
          - not_null
      - name: nuts_id
        description: "NUTS-3 code of the overlapping region"
        tests:
          - not_null
      - name: region_name
        description: "Name of the NUTS-3 region"
      - name: intersection_area_m2
        description: "Geometric intersection area of the employment agency district and the NUTS-3 region in m² (EPSG:3035)"
      - name: agentur_area_m2
        description: "Total area of the employment agency district in m²"
      - name: nuts3_area_m2
        description: "Total area of the NUTS-3 region in m²"
      - name: area_share_of_agentur
        description: "Share of the district's area that falls into this NUTS-3 region (rows per district sum to approximately 1.0)"
      - name: area_share_of_nuts3
        description: "Share of the NUTS-3 region's area that falls into this district (rows per NUTS-3 region sum to approximately 1.0)"

  - name: mart_dataset_aggregation_meta
    description: "Aggregation metadata per indicator: level, measure type (sum vs. weighted_avg), kind, and whether the aggregation is an approximation."
    columns:
      - name: dataset_slug
        tests:
          - not_null
      - name: indicator
        tests:
          - not_null
      - name: level
        tests:
          - accepted_values:
              values: ['lau', 'nuts3', 'agentur']
      - name: measure_type
        tests:
          - accepted_values:
              values: ['sum', 'weighted_avg']
      - name: kind
        tests:
          - accepted_values:
              values: ['count', 'rate', 'mean', 'median']

  - name: mart_custom_region_unit_values
    description: "Harmonised values per level (LAU, NUTS-3, employment agency district), including population as weight. Basis for custom region aggregation. NUTS-3 and LAU are fixed to target version 2024."
    columns:
      - name: level
        tests:
          - accepted_values:
              values: ['lau', 'nuts3', 'agentur']
      - name: unit_id
        tests:
          - not_null
      - name: dataset_slug
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: value
        tests:
          - not_null
      - name: is_crosswalked
        description: "True if the value was converted across a NUTS or LAU version boundary; false for a direct value"
        tests:
          - not_null
