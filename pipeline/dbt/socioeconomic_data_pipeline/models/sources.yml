version: 2

sources:
  - name: loaded_data
    description: "Raw data loaded by DLT pipeline"
    schema: loaded_data
    tables:
      - name: lau_geometry
        description: "LAU geometry data from GeoJSON files"
        columns:
          - name: gisco_id
            description: "Unique LAU identifier from GISCO"
            tests:
              - not_null
          - name: year
            description: "Year of the data"
            tests:
              - not_null
          - name: geometry
            description: "PostGIS geometry as WKT"
          - name: lau_name
            description: "Name of the LAU"
          - name: cntr_code
            description: "Country code"
          - name: nuts_3
            description: "NUTS 3 region code"
            
      - name: lau_population
        description: "LAU population data from CSV files"
        columns:
          - name: gisco_id
            description: "Unique LAU identifier from GISCO"
            tests:
              - not_null
          - name: year
            description: "Year of the data"
            tests:
              - not_null
          - name: population
            description: "Total population"
          - name: lau_name
            description: "Name of the LAU"
          - name: cntr_code
            description: "Country code"

      - name: nuts_geometry
        description: "NUTS geometry data from GeoJSON files"
        columns:
          - name: nuts_id
            description: "Unique NUTS identifier from GISCO"
            tests:
              - not_null
          - name: levl_code
            description: "NUTS level code (0-3)"
          - name: cntr_code
            description: "Country code"
          - name: nuts_name
            description: "Region name from source"
          - name: name_latn
            description: "Latinized region name"
          - name: year
            description: "Year of the geometry dataset"
            tests:
              - not_null
          - name: geometry
            description: "PostGIS geometry as WKT"
            
      - name: arbeitslosenzahlen_agentur_arbeit
        description: "Unemployment data from Agentur für Arbeit (transposed, normalized)"
        columns:
          - name: dataset_id
            description: "Unique identifier linking to metadata table"
            tests:
              - not_null
              - relationships:
                  to: source('loaded_data', 'arbeitslosenzahlen_metadata')
                  field: dataset_id
          - name: original_id
            description: "Original region ID from source data"
          - name: original_name
            description: "Original region name from source data"
          - name: geodata_id
            description: "Mapped geodata ID (LAU/NUTS code)"
            tests:
              - not_null
          - name: geodata_name
            description: "Mapped geodata name"
          - name: mapper
            description: "Mapping method used"
          - name: parameter
            description: "Mapping parameter"
          - name: time_column
            description: "Original time column name from CSV"
            tests:
              - not_null
          - name: is_date
            description: "Whether time_column is a date or year"
          - name: arbeitslose
            description: "Number of unemployed persons"
            tests:
              - not_null
          - name: year
            description: "Year extracted from time_column"
          - name: month
            description: "Month extracted from time_column (null for yearly data)"
          - name: day
            description: "Day extracted from time_column"
          - name: time_type
            description: "Type of time data: yearly, monthly, or unknown"
            tests:
              - accepted_values:
                  values: ['yearly', 'monthly', 'unknown']
          - name: load_date
            description: "Date when the data was originally loaded"
            tests:
              - not_null
              
      - name: arbeitslosenzahlen_metadata
        description: "Metadata for unemployment datasets from Agentur für Arbeit"
        columns:
          - name: dataset_id
            description: "Unique identifier for the dataset (primary key)"
            tests:
              - unique
              - not_null
          - name: title
            description: "Dataset title"
          - name: series
            description: "Data series name"
          - name: publisher_name
            description: "Publisher name"
          - name: source_name
            description: "Source name"
          - name: source_url
            description: "Source URL"
          - name: description
            description: "Dataset description"
          - name: table_name
            description: "Original table name"
          - name: page_number
            description: "Page number in source file"
          - name: load_date
            description: "Date when data was loaded"
          - name: collection_date
            description: "Date when data was collected"
          - name: start_date
            description: "Start date of time series"
          - name: end_date
            description: "End date of time series"
          - name: categories
            description: "Data categories (comma-separated)"
          - name: geodata_level
            description: "Geodata level (e.g., NUTS 3)"
          - name: geodata_year
            description: "Geodata reference year"
          - name: methodology
            description: "Methodology description"
          - name: license
            description: "Data license"
          - name: updated_at
            description: "Timestamp of last metadata update"

      - name: results_arbeitslose_kreise
        description: "Arbeitslosenzahlen je Kreis – long format, ein Record pro Region und Jahr"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Anzahl Arbeitsloser"

      - name: dataset_metadata
        description: "Provenance/license/description metadata for the generic (meta.yaml-driven) Kreis/Gemeinden datasets, one row per dataset_slug, upserted by load_soziodata_generic.py on every run"
        columns:
          - name: dataset_slug
            description: "Stable slug identifying the dataset, matches the dataset_slug used in mart_*_sociodata_harmonized/mart_socioeconomic_inventory"
            tests:
              - unique
              - not_null
          - name: table_name
            description: "loaded_data table this metadata belongs to (results_<dataset>_kreise/_gemeinden)"
          - name: name
            description: "Short display name"
          - name: description
            description: "Short description"
          - name: description_long
            description: "Long-form methodological description"
          - name: unit
            description: "Unit of the value column"
          - name: source
            description: "Publisher / source series (provenance)"
          - name: license
            description: "Data usage license, null if not yet researched"
          - name: license_url
            description: "URL to the license text, null if not yet researched"
          - name: algorithm
            description: "Free-text note on how the value is computed/derived, if applicable"
          - name: number_type
            description: "absolute or relative"
          - name: geodata_level
            description: "Geodata level the dataset is mapped to (e.g. NUTS_3)"
          - name: geodata_year
            description: "Reference year of the geodata used for mapping"
          - name: updated_at
            description: "Timestamp of the last upsert"

      - name: results_bevoelkerung_kreise
        description: "Bevölkerungsdaten je Kreis (Destatis) – long format, ein Record pro Region und Jahr"
        columns:
          - name: original_id_1
            description: "Amtlicher Regionalschlüssel (ARS) aus der Quelldatei"
            tests:
              - not_null
          - name: original_name
            description: "Regionsname aus der Quelldatei"
            tests:
              - not_null
          - name: geodata_name
            description: "Gemappter Geodata-Name"
          - name: geodata_id_nuts
            description: "NUTS-3-Code der Region"
            tests:
              - not_null
          - name: geodata_id_ars
            description: "Amtlicher Regionalschlüssel (ARS) nach Mapping"
          - name: mapper
            description: "Mapping-Methode"
          - name: parameter
            description: "Mapping-Parameter"
          - name: year
            description: "Jahr der Beobachtung"
            tests:
              - not_null
          - name: value
            description: "Bevölkerungszahl (Einwohner gesamt)"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata-Ebene (NUTS_3)"
          - name: geodata_year
            description: "Referenzjahr der Geodaten"
          - name: dataset_name
            description: "Name des Datensatzes (results_bevoelkerung_kreise)"

      - name: results_beschaeftigungsquote_gemeinden
        description: "Beschäftigungsquote je Gemeinde (LAU) – long format, ein Record pro Gemeinde und Jahr (%)"
        columns:
          - name: original_id_1
            description: "Gemeinde-ID (LAU-Identifikation)"
            tests:
              - not_null
          - name: original_name
            description: "Gemeindename aus der Quelldatei"
            tests:
              - not_null
          - name: geodata_name
            description: "Gemappter Geodata-Name"
          - name: geodata_id_nuts
            description: "NUTS-3-Code der Region (kann null sein für Gemeinden ohne NUTS-3-Mapping)"
          - name: geodata_id_lau
            description: "Gemappte LAU-ID der Gemeinde"
          - name: geodata_id_ars
            description: "Amtlicher Regionalschlüssel nach Mapping"
          - name: mapper
            description: "Mapping-Methode"
          - name: parameter
            description: "Mapping-Parameter"
          - name: year
            description: "Jahr der Beobachtung"
            tests:
              - not_null
          - name: value
            description: "Beschäftigungsquote in Prozent (0–100)"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata-Ebene (LAU für Gemeinden)"
          - name: geodata_year
            description: "Referenzjahr der Geodaten"
          - name: dataset_name
            description: "Name des Datensatzes (results_beschaeftigungsquote_gemeinden)"
      - name: results_schuldnerquote_kreise
        description: "Schuldnerquote je Kreis (Creditreform) – long format, ein Record pro Region und Jahr"
        columns:
          - name: original_id_1
            description: "Amtlicher Regionalschlüssel aus der Quelldatei"
            tests:
              - not_null
          - name: original_name
            description: "Regionsname aus der Quelldatei"
            tests:
              - not_null
          - name: geodata_name
            description: "Gemappter Geodata-Name"
          - name: geodata_id_nuts
            description: "NUTS-3-Code der Region"
            tests:
              - not_null
          - name: geodata_id_ars
            description: "Amtlicher Regionalschlüssel nach Mapping"
          - name: mapper
            description: "Mapping-Methode"
          - name: parameter
            description: "Mapping-Parameter"
          - name: year
            description: "Jahr der Beobachtung"
            tests:
              - not_null
          - name: value
            description: "Schuldnerquote in Prozent"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata-Ebene (NUTS_3)"
          - name: geodata_year
            description: "Referenzjahr der Geodaten"
          - name: dataset_name
            description: "Name des Datensatzes (results_schuldnerquote_kreise)"

      - name: results_arbeitsvolumen_kreise
        description: "Arbeitsvolumen je Kreis – long format, ein Record pro Region und Jahr (Stunden)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Arbeitsvolumen in Stunden"

      - name: results_bruttoverdienst_kreise
        description: "Bruttoverdienst je Kreis – long format, ein Record pro Region und Jahr (Euro)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Bruttoverdienst in Euro"

      - name: results_durchschnittsalter_kreise
        description: "Durchschnittsalter je Kreis – long format, ein Record pro Region und Jahr (Jahre)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Durchschnittsalter in Jahren"

      - name: results_sgb_ii_quote_kreise
        description: "SGB-II-Quote je Kreis – long format, ein Record pro Region und Jahr (%)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "SGB-II-Quote in Prozent"

      - name: results_wohngeldhaushalte_kreise
        description: "Wohngeldhaushalte je Kreis – long format, ein Record pro Region und Jahr (je 1000 EW)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Wohngeldhaushalte je 1000 Einwohner"
          - name: dataset_name
            description: "Name des Datensatzes (results_wohngeldhaushalte_kreise)"

      - name: results_auszubildende_kreise
        description: "Auszubildende je Kreis – long format, ein Record pro Region und Jahr (je 1.000 SV-Beschäftigte)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Auszubildende je 1.000 sozialversicherungspflichtig Beschäftigte"

      - name: results_erwerbstaetige_pro_1000_einwohner_kreise
        description: "Erwerbstätige je 1.000 Einwohner je Kreis – long format, ein Record pro Region und Jahr"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Erwerbstätige je 1.000 Einwohner"

      - name: results_kinderarmut_kreise
        description: "Kinderarmut je Kreis – nicht erwerbsfähige SGB-II-Leistungsberechtigte unter 15 Jahren je 100 Einwohner – long format"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Nicht erwerbsfähige SGB-II-Leistungsberechtigte unter 15 Jahren je 100 Einwohner"

      - name: results_medianeinkommen_kreise
        description: "Medianeinkommen je Kreis – long format, ein Record pro Region und Jahr (Euro)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Medianeinkommen in Euro"

      - name: results_studierende_kreise
        description: "Studierende je 1.000 Einwohner je Kreis – long format, ein Record pro Region und Jahr"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Studierende je 1.000 Einwohner"