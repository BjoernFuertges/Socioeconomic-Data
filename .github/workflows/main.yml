# Gate -> tests -> semantic-release dry run -> image builds (GHCR) -> release -> deploy (Hetzner) -> E2E.
name: "CI, Release und Deployment"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initial_load:
        description: "Nach dem Deploy dlt + dbt einmalig komplett im Hintergrund auf dem Server ausführen (frischer Server / Neuaufbau der Daten); der E2E-Datencheck entfällt dann"
        type: boolean
        default: false

env:
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  should-run:
    name: Determine trigger gates
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run_tests: ${{ steps.gate.outputs.run_tests }}
      run_build: ${{ steps.gate.outputs.run_build }}
      run_deploy: ${{ steps.gate.outputs.run_deploy }}
    steps:
      - name: Compute gates
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_tests=false
          run_build=false
          run_deploy=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            run_tests=true
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            run_tests=true
            # github.actor is whoever clicked "Merge", not the PR author.
            # A merged Dependabot PR is therefore detected via the PR of the head commit.
            pr_author=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].user.login // empty')
            if [[ "$pr_author" != "dependabot[bot]" ]]; then
              run_build=true
              run_deploy=true
            fi
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_tests=true
            run_build=true
            # Deploy only from the default branch; other branches only build images
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              run_deploy=true
            fi
          fi

          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"
          echo "run_deploy=$run_deploy" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test-backend:
    name: Test backend (Go)
    if: needs.should-run.outputs.run_tests == 'true'
    needs: [should-run]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check Swagger router annotations
        run: bash scripts/check_swagger_router_annotations.sh

  test-frontend:
    name: Test frontend (type-check + build)
    if: needs.should-run.outputs.run_tests == 'true'
    needs: [should-run]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/web/app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/web/app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/app/package-lock.json

      - run: npm ci

      # vue-tsc -b + vite build; the only static check of the frontend
      - run: npm run build

  test-docs:
    name: Test docs
    if: needs.should-run.outputs.run_tests == 'true'
    needs: [should-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install --no-cache-dir -r requirements-docs.txt

      - run: mkdocs build --strict -d /tmp/site

  test-pipeline:
    name: Test pipeline (Syntax-Check dlt)
    if: needs.should-run.outputs.run_tests == 'true'
    needs: [should-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # dlt/dbt need a database; without Postgres we only check that all scripts compile.
      - run: python -m compileall -q pipeline/dlt

  validate-compose:
    name: Validate docker compose file
    if: needs.should-run.outputs.run_tests == 'true'
    needs: [should-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config
        working-directory: backend/deployments
        env:
          APP_HOST: example.org
          GHCR_OWNER: example
          DB_PASSWORD: dummy
          LE_EMAIL: admin@example.org
        run: |
          cp .env.backend.example .env.backend
          docker compose -f docker-compose.yml config --quiet

  # ---------------------------------------------------------------------------
  # Determine release version (dry run) and build images
  # ---------------------------------------------------------------------------
  semantic-release-dry:
    name: Semantic Release Dry Run
    if: needs.should-run.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    # Nothing is built while a test fails.
    needs: [should-run, test-backend, test-frontend, test-docs, test-pipeline, validate-compose]
    outputs:
      nextReleaseVersion: ${{ steps.semantic.outputs.new_release_version }}
      build_time: ${{ steps.build_time.outputs.build_time }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ">=22.22.2"

      - name: Semantic Release (dry run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.0
            @semantic-release/github@12.0.9
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMANTIC_RELEASE }}

      - name: Build time
        id: build_time
        run: echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]]; then
            echo "Nächste Version: ${{ steps.semantic.outputs.new_release_version }}"
          else
            echo "::notice::Kein neuer Release (z. B. nur chore-Commits). Images werden trotzdem mit sha-Tag gebaut und deployt."
          fi

  build-and-push-images:
    name: Build image (${{ matrix.name }})
    if: needs.should-run.outputs.run_build == 'true'
    needs: [should-run, semantic-release-dry]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend/web/app
            file: ./frontend/web/app/Dockerfile
          - name: docs
            context: .
            file: ./Dockerfile.docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed for the fallback version (see below)

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase namespace
      - name: Determine image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${owner}/soziodata-${{ matrix.name }}"
          version="${{ needs.semantic-release-dry.outputs.nextReleaseVersion }}"
          short_sha="${GITHUB_SHA::7}"
          tags="${base}:sha-${short_sha}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            tags="${tags},${base}:latest"
            if [[ -n "$version" ]]; then
              tags="${tags},${base}:${version}"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

          # Version reported by the backend (OpenAPI info.version, /health): the new release's version when there is one,
          # otherwise the last release tag plus commit as SemVer build metadata, e.g. 1.4.2+sha.abc1234
          if [[ -z "$version" ]]; then
            last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            version="${last_tag#v}"
            version="${version:-0.0.0}+sha.${short_sha}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Build args a Dockerfile does not declare are ignored by Docker
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ needs.semantic-release-dry.outputs.build_time }}
          # links the GHCR package to this repo (permissions are inherited)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}

  semantic-release-final:
    name: Semantic Release final
    if: needs.should-run.outputs.run_deploy == 'true'
    needs: [should-run, build-and-push-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SEMANTIC_RELEASE }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ">=22.22.2"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.0
            @semantic-release/github@12.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMANTIC_RELEASE }}

      - name: Released version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "Released ${{ steps.semantic.outputs.new_release_version }}"

  # ---------------------------------------------------------------------------
  # Deployment to Hetzner + E2E against the deployed instance
  # ---------------------------------------------------------------------------
  deploy-hetzner:
    name: Deploy to Hetzner
    if: needs.should-run.outputs.run_deploy == 'true'
    needs: [should-run, build-and-push-images, semantic-release-final]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: deploy-hetzner
      cancel-in-progress: false
    env:
      REMOTE_REPO: /opt/soziooekonomische-daten
    steps:
      # Only for the local composite-action path; checks out the commit that was tested and built.
      - uses: actions/checkout@v7

      - name: Check DNS of APP_HOST
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          : "${APP_HOST:?Repo-Variable APP_HOST ist nicht gesetzt}"
          : "${SSH_HOST:?Repo-Variable SSH_HOST ist nicht gesetzt}"
          app_ips="$(getent ahostsv4 "$APP_HOST" | awk '{print $1}' | sort -u || true)"
          srv_ips="$(getent ahostsv4 "$SSH_HOST" | awk '{print $1}' | sort -u || true)"
          echo "APP_HOST $APP_HOST -> ${app_ips:-<keine Auflösung>}"
          echo "SSH_HOST $SSH_HOST -> ${srv_ips:-<keine Auflösung>}"
          if [[ -z "$app_ips" || "$app_ips" != "$srv_ips" ]]; then
            echo "::error::DNS für $APP_HOST zeigt nicht auf den Server ($SSH_HOST). Erst A-Record setzen, sonst scheitert die Let's-Encrypt-Challenge (Rate-Limits)."
            exit 1
          fi

      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Prepare configuration files
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          LE_EMAIL: ${{ secrets.LE_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RCLONE_SOURCE: ${{ vars.RCLONE_SOURCE }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          PGDATA_DIR: ${{ vars.PGDATA_DIR }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          : "${LE_EMAIL:?Secret LE_EMAIL fehlt}"
          : "${DB_PASSWORD:?Secret DB_PASSWORD fehlt}"
          umask 077
          mkdir -p "$RUNNER_TEMP/incoming"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "APP_HOST=${APP_HOST}"
            echo "LE_EMAIL=${LE_EMAIL}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "GHCR_OWNER=${owner}"
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}"
            echo "PGDATA_DIR=${PGDATA_DIR:-/mnt/pgdata/data}"
          } > "$RUNNER_TEMP/incoming/.env"
          if [[ -n "${RCLONE_SOURCE:-}" && -n "${RCLONE_CONF:-}" ]]; then
            echo "RCLONE_SOURCE=${RCLONE_SOURCE}" > "$RUNNER_TEMP/incoming/.env.nextcloud-sync"
            printf '%s\n' "$RCLONE_CONF" > "$RUNNER_TEMP/incoming/rclone.conf"
          else
            echo "::warning::RCLONE_SOURCE/RCLONE_CONF nicht gesetzt - Nextcloud-Sync wird übersprungen."
          fi
          if [[ -n "${BACKUP_S3_BUCKET:-}" && -n "${BACKUP_S3_REGION:-}" && -n "${BACKUP_S3_ACCESS_KEY:-}" && -n "${BACKUP_S3_SECRET_KEY:-}" ]]; then
            {
              echo "BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}"
              echo "BACKUP_S3_REGION=${BACKUP_S3_REGION}"
              echo "BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY}"
              echo "BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY}"
            } > "$RUNNER_TEMP/incoming/.env.backup"
          else
            echo "::warning::BACKUP_S3_* nicht vollständig gesetzt - nächtliches DB-Backup wird nicht eingerichtet."
          fi

      - name: Upload configuration
        run: |
          set -euo pipefail
          ssh hetzner 'umask 077; rm -rf ~/deploy-incoming; mkdir -p ~/deploy-incoming'
          scp -q -r "$RUNNER_TEMP/incoming/." hetzner:deploy-incoming/

      - name: Check out commit on server
        run: |
          ssh hetzner "set -euo pipefail; cd '$REMOTE_REPO'; export GIT_LFS_SKIP_SMUDGE=1; git fetch --quiet origin; git checkout --quiet --detach '${GITHUB_SHA}'"

      - name: Roll out stack
        id: rollout
        run: |
          ssh hetzner "bash '$REMOTE_REPO/backend/scripts/deploy_remote.sh' apply '${GITHUB_SHA}' '${{ inputs.initial_load == true }}'"

      - name: Note on initial load
        if: inputs.initial_load == true
        run: |
          echo "### Initialer Daten-Load läuft im Hintergrund auf dem Server" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: \`ssh deploy@${{ vars.SSH_HOST }} 'bash $REMOTE_REPO/backend/scripts/deploy_remote.sh initial-load-status'\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove configuration from server
        if: always()
        run: ssh hetzner 'rm -rf ~/deploy-incoming' || true

      - name: Wait for backend health
        id: health
        env:
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors --max-time 15 \
            "https://${APP_HOST}/api/v1/health"

      # Only if the rollout itself started (earlier failures, e.g. DNS/SSH, do not change the server).
      # Without a saved good state (very first deploy) the rollback fails with a clear message.
      - name: Roll back after failed rollout
        if: always() && (steps.rollout.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          ssh hetzner "bash '$REMOTE_REPO/backend/scripts/deploy_remote.sh' rollback"
          echo "::error::Rollout fehlgeschlagen - auf den letzten guten Stand zurückgesetzt."

  e2e-production:
    name: E2E (Playwright gegen Produktion)
    needs: [should-run, deploy-hetzner]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend/web/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/web/app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/app/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: https://${{ vars.APP_HOST }}
          # During the initial load dlt/dbt still run in the background, so the database is still empty
          E2E_EXPECT_DATA: ${{ inputs.initial_load == true && 'false' || 'true' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/web/app/playwright-report
            frontend/web/app/test-results

  mark-good:
    name: Mark deployed state as good
    needs: [e2e-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - run: ssh hetzner "bash /opt/soziooekonomische-daten/backend/scripts/deploy_remote.sh mark-good '${GITHUB_SHA}'"

  rollback:
    name: Roll back to last good state
    needs: [deploy-hetzner, e2e-production]
    if: always() && needs.deploy-hetzner.result == 'success' && needs.e2e-production.result == 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ssh-setup
        with:
          host: ${{ vars.SSH_HOST }}
          user: ${{ vars.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Roll back
        run: ssh hetzner "bash /opt/soziooekonomische-daten/backend/scripts/deploy_remote.sh rollback"

      - name: Fail the run
        run: |
          echo "::error::E2E gegen Produktion fehlgeschlagen - auf den letzten guten Stand zurückgesetzt."
          exit 1
