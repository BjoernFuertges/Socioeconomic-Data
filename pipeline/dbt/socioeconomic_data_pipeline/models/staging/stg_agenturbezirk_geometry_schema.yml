version: 2

models:
  - name: stg_agenturbezirk_geometry
    description: "Boundaries of all employment agency districts (Agenturbezirke), reprojected to WGS84. Single boundary vintage; no multi-version history yet."
    columns:
      - name: ba_schl
        description: "Official BA key of the employment agency district"
        data_type: text
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the employment agency district"
        data_type: text
        tests:
          - not_null
      - name: id_dwh
        description: "Source ID in the data warehouse"
        data_type: text
      - name: valid_from
        description: "Valid-from date from the shapefile"
        data_type: date
      - name: valid_to
        description: "Valid-to date from the shapefile"
        data_type: date
      - name: geometry_wgs84
        description: "Geometry in WGS84 (EPSG:4326)"
        tests:
          - not_null
      - name: has_valid_geometry
        description: "True if a non-empty geometry is present"
        data_type: boolean
        tests:
          - not_null
      - name: loaded_at
        description: "Timestamp of the staging run"
