socioeconomic_data_pipeline:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST', 'postgis') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: transformed_data
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
      sslmode: disable
