info:
  contact:
    email: Socioeconomic-Data@b.sgtrf.de
    name: API Support
  description: REST-API für LAU-Geodaten und Arbeitslosenzahlen aus dbt-transformierten
    Daten
  termsOfService: http://swagger.io/terms/
  title: Sozioökonomische Daten API
  version: dev
paths:
  /agenturbezirke:
    get:
      consumes:
      - application/json
      description: Gibt alle Agenturbezirke mit Geometrie zurück. Agenturbezirke sind
        eine eigenständige Gebietsgliederung, nicht deckungsgleich mit NUTS-3/LAU/ARS.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturbezirkSummary'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Liste aller Agenturbezirke
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}:
    get:
      consumes:
      - application/json
      description: Gibt Details eines Agenturbezirks mit Geometrie zurück
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturbezirkSummary'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Agenturbezirk-Details
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/arbeitslosigkeit:
    get:
      consumes:
      - application/json
      description: Gibt die monatliche Zeitreihe (Arbeitslose, Unterbeschäftigung)
        für einen Agenturbezirk zurück (AfA Lange Zeitreihen, ab Januar 2007)
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturbezirkArbeitslosigkeitPoint'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Monatliche Arbeitslosenzahlen eines Agenturbezirks
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/dataset-aggregate/{slug}:
    get:
      consumes:
      - application/json
      description: 'Aggregiert einen Kreis-grain-Soziodata-Datensatz (siehe GET /nuts/{nuts_id}/datasets)
        über den Agentur<->NUTS-3-Flächenanteils-Crosswalk auf Agenturbezirk-Ebene
        hoch (Summe bzw. bevölkerungsgewichteter Durchschnitt je nach Datensatz, siehe
        mart_agentur_dataset_aggregate). Analog zu GET /nuts/{nuts_id}/dataset-aggregate/{slug}
        für NUTS-0/1/2. LIMITATIONEN: Summen (Zählgrößen) sind Summen der Kreis-Werte;
        Quoten und Durchschnitte sind ein bevölkerungsgewichteter Durchschnitt der
        Kreis-Werte (Werte je Erwerbstätigen: erwerbstätigengewichtet; Rückfall auf
        Flächengewichte, wenn die Gewichte fehlen) - eine Näherung, keine exakte Neuberechnung,
        da Zähler/Nenner nicht vorliegen und die Gesamtbevölkerung nur Ersatz für
        die eigentliche Bezugsgröße ist. Mediane lassen sich nicht aus Kreis-Medianen
        zusammensetzen (nur Schätzung). Berlin: ein Kreis verteilt sich auf drei Agenturbezirke,
        Summen werden flächenanteilig aufgeteilt. Pro Punkt kennzeichnen aggregation_method
        und value_kind das Verfahren.'
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      - description: Route-Slug des Datensatzes
        example: bevoelkerung
        in: path
        name: slug
        required: true
        type: string
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturDatasetAggregatePoint'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: Auf Agenturbezirk-Ebene aggregierte Datensatz-Zeitreihe
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/nuts-hierarchy:
    get:
      consumes:
      - application/json
      description: Gibt alle überlappenden NUTS-1/2/3-Regionen eines Agenturbezirks
        zurück. is_fully_contained markiert Regionen, die den Agenturbezirk vollständig
        enthalten (Flächenanteil >= 99 %); is_parent die kleinste davon (übergeordnete
        Region). Reicht ein Agenturbezirk über Bundeslandgrenzen hinaus, ist keine
        Zeile is_parent. Räumliche Schätzung, keine amtliche Zuordnung.
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturNutsMembership'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: NUTS-Hierarchie eines Agenturbezirks (Kreis/Regierungsbezirk/Bundesland)
      tags:
      - Agenturbezirke
  /agenturbezirke/{ba_schl}/nuts3:
    get:
      consumes:
      - application/json
      description: 'Gibt die überlappenden NUTS-3-Regionen eines Agenturbezirks zurück,
        mit Flächenanteil in beide Richtungen. Agenturbezirke bestehen i.d.R. aus
        einem oder mehreren ganzen Kreisen (Ausnahme Berlin: 3 Agenturbezirke teilen
        sich einen Kreis) - eine räumliche Schätzung, keine amtliche Zuordnung.'
      parameters:
      - description: Amtlicher BA-Schlüssel des Agenturbezirks
        example: "962"
        in: path
        name: ba_schl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.AgenturNuts3Share'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_BjoernFuertges_Socioeconomic-Data_backend_internal_models.APIResponse'
      summary: NUTS-3-Zuordnung eines Agenturbezirks (Flächenanteile)
      tags:
      - Agenturbezirke
  /agenturbezirke/dataset-aggregate:
    get:
      consumes:
      - application/json
      description: Gibt alle (Datensatz-Slug, Jahr)-Kombinationen zurück, für die
        mart_agentur_dataset_aggregate Werte enthält - Grundlage der Datensatz-/Jahresauswahl
        in der Karte.
      parameters:
      - description: Überschreibt den Accept-Header
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: 'Content-Disposition: attachment setzen'
        example: false
        in: query
        name: download
        type: boolean
      produces:
