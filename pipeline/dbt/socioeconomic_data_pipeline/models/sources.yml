version: 2

sources:
  - name: loaded_data
    description: "Raw data loaded by the ingestion pipeline"
    schema: loaded_data
    tables:
      - name: lau_geometry
        description: "LAU (municipality) boundaries from GISCO GeoJSON files"
        columns:
          - name: gisco_id
            description: "Unique LAU identifier from GISCO"
            tests:
              - not_null
          - name: year
            description: "Boundary vintage year"
            tests:
              - not_null
          - name: geometry
            description: "Geometry as WKT"
          - name: lau_name
            description: "Name of the LAU unit"
          - name: cntr_code
            description: "Country code"
          - name: nuts_3
            description: "NUTS-3 region code"

      - name: lau_population
        description: "LAU population data from CSV files"
        columns:
          - name: gisco_id
            description: "Unique LAU identifier from GISCO"
            tests:
              - not_null
          - name: year
            description: "Reference year of the data"
            tests:
              - not_null
          - name: population
            description: "Total population"
          - name: lau_name
            description: "Name of the LAU unit"
          - name: cntr_code
            description: "Country code"

      - name: nuts_geometry
        description: "NUTS region boundaries from GISCO GeoJSON files"
        columns:
          - name: nuts_id
            description: "Unique NUTS identifier from GISCO"
            tests:
              - not_null
          - name: levl_code
            description: "NUTS level code (0-3)"
          - name: cntr_code
            description: "Country code"
          - name: nuts_name
            description: "Region name from the source"
          - name: name_latn
            description: "Latinised region name"
          - name: year
            description: "Year of the geometry dataset"
            tests:
              - not_null
          - name: geometry
            description: "Geometry as WKT"

      - name: agenturbezirk_geometry
        description: "Boundaries of all approx. 146 employment agency districts (Agenturbezirke) of the Federal Employment Agency. Own district structure, not congruent with NUTS, LAU or ARS."
        columns:
          - name: ba_schl
            description: "Official BA key of the employment agency district (e.g. '962' for AA Berlin Mitte)"
            tests:
              - unique
              - not_null
          - name: name
            description: "Name of the employment agency district"
            tests:
              - not_null
          - name: id_dwh
            description: "Source ID in the data warehouse"
          - name: valid_from
            description: "Valid-from date from the shapefile"
          - name: valid_to
            description: "Valid-to date from the shapefile"
          - name: geometry
            description: "Geometry as WKT (already reprojected to WGS84 / EPSG:4326)"

      - name: results_arbeitslosenzahlen_afa_agenturbezirke
        description: "Monthly unemployment and underemployment counts per employment agency district, published by the Federal Employment Agency statistics"
        columns:
          - name: geodata_id_agentur
            description: "Official BA key of the employment agency district, links to agenturbezirk_geometry.ba_schl"
            tests:
              - not_null
          - name: geodata_name
            description: "Name of the employment agency district"
          - name: year
            description: "Year of the reporting month"
            tests:
              - not_null
          - name: month
            description: "Month of the reporting period (1-12)"
            tests:
              - not_null
          - name: arbeitslose
            description: "Number of unemployed persons in the reporting month; null if suppressed by the source ('x')"
          - name: unterbeschaeftigung
            description: "Underemployment (excluding short-time work) in the reporting month; null if statistically suppressed"

      - name: results_arbeitslose_kreise
        description: "Unemployment counts per district (Kreis), long format, one record per region and year"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Number of unemployed persons"

      - name: dataset_metadata
        description: "Provenance, license and description metadata for the generic Kreis/Gemeinden datasets, one row per dataset_slug, upserted on every load"
        columns:
          - name: dataset_slug
            description: "Stable slug identifying the dataset"
            tests:
              - unique
              - not_null
          - name: table_name
            description: "Source table this metadata belongs to (results_<dataset>_kreise / _gemeinden)"
          - name: name
            description: "Short display name"
          - name: description
            description: "Short description"
          - name: description_long
            description: "Long-form methodological description"
          - name: unit
            description: "Unit of the value column"
          - name: source
            description: "Publisher / source series (provenance)"
          - name: license
            description: "Data usage license; null if not yet researched"
          - name: license_url
            description: "URL to the license text; null if not yet researched"
          - name: algorithm
            description: "Free-text note on how the value is computed or derived, if applicable"
          - name: number_type
            description: "absolute or relative"
          - name: geodata_level
            description: "Geodata level the dataset is mapped to (e.g. NUTS_3)"
          - name: geodata_year
            description: "Reference year of the geodata used for mapping"
          - name: updated_at
            description: "Timestamp of the last update"

      - name: results_bevoelkerung_kreise
        description: "Population per district (Kreis), Destatis, long format, one record per region and year"
        columns:
          - name: original_id_1
            description: "Official regional key (ARS) from the source file"
            tests:
              - not_null
          - name: original_name
            description: "Region name from the source file"
            tests:
              - not_null
          - name: geodata_name
            description: "Mapped geodata name"
          - name: geodata_id_nuts
            description: "NUTS-3 code of the region"
            tests:
              - not_null
          - name: geodata_id_ars
            description: "Official regional key (ARS) after mapping"
          - name: mapper
            description: "Mapping method"
          - name: parameter
            description: "Mapping parameter"
          - name: year
            description: "Year of observation"
            tests:
              - not_null
          - name: value
            description: "Population count (total inhabitants)"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata level (NUTS_3)"
          - name: geodata_year
            description: "Reference year of the geodata"
          - name: dataset_name
            description: "Dataset name (results_bevoelkerung_kreise)"

      - name: results_beschaeftigungsquote_gemeinden
        description: "Employment rate per municipality (LAU), long format, one record per municipality and year (%)"
        columns:
          - name: original_id_1
            description: "Municipality ID (LAU identifier)"
            tests:
              - not_null
          - name: original_name
            description: "Municipality name from the source file"
            tests:
              - not_null
          - name: geodata_name
            description: "Mapped geodata name"
          - name: geodata_id_nuts
            description: "NUTS-3 code of the region (may be null for municipalities without a NUTS-3 mapping)"
          - name: geodata_id_lau
            description: "Mapped LAU ID of the municipality"
          - name: geodata_id_ars
            description: "Official regional key after mapping"
          - name: mapper
            description: "Mapping method"
          - name: parameter
            description: "Mapping parameter"
          - name: year
            description: "Year of observation"
            tests:
              - not_null
          - name: value
            description: "Employment rate in percent (0-100)"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata level (LAU for municipalities)"
          - name: geodata_year
            description: "Reference year of the geodata"
          - name: dataset_name
            description: "Dataset name (results_beschaeftigungsquote_gemeinden)"

      - name: results_schuldnerquote_kreise
        description: "Debtor quota per district (Kreis), Creditreform, long format, one record per region and year"
        columns:
          - name: original_id_1
            description: "Official regional key from the source file"
            tests:
              - not_null
          - name: original_name
            description: "Region name from the source file"
            tests:
              - not_null
          - name: geodata_name
            description: "Mapped geodata name"
          - name: geodata_id_nuts
            description: "NUTS-3 code of the region"
            tests:
              - not_null
          - name: geodata_id_ars
            description: "Official regional key after mapping"
          - name: mapper
            description: "Mapping method"
          - name: parameter
            description: "Mapping parameter"
          - name: year
            description: "Year of observation"
            tests:
              - not_null
          - name: value
            description: "Debtor quota in percent"
            tests:
              - not_null
          - name: geodata_level
            description: "Geodata level (NUTS_3)"
          - name: geodata_year
            description: "Reference year of the geodata"
          - name: dataset_name
            description: "Dataset name (results_schuldnerquote_kreise)"

      - name: results_arbeitsvolumen_kreise
        description: "Labour volume per district (Kreis), long format, one record per region and year (hours)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Labour volume in hours"

      - name: results_bruttoverdienst_kreise
        description: "Gross earnings per district (Kreis), long format, one record per region and year (euro)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Gross earnings in euros"

      - name: results_durchschnittsalter_kreise
        description: "Average age per district (Kreis), long format, one record per region and year (years)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Average age in years"

      - name: results_sgb_ii_quote_kreise
        description: "SGB II quota per district (Kreis), long format, one record per region and year (%)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "SGB II quota in percent"

      - name: results_wohngeldhaushalte_kreise
        description: "Housing benefit households per district (Kreis), long format, one record per region and year (per 1,000 inhabitants)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Housing benefit households per 1,000 inhabitants"
          - name: dataset_name
            description: "Dataset name (results_wohngeldhaushalte_kreise)"

      - name: results_auszubildende_kreise
        description: "Trainee rate per district (Kreis): trainees per 1,000 employees subject to social insurance contributions, long format, one record per region and year"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Trainees per 1,000 employees subject to social insurance contributions"

      - name: results_erwerbstaetige_pro_1000_einwohner_kreise
        description: "Employed persons per 1,000 inhabitants per district (Kreis), long format, one record per region and year"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Employed persons per 1,000 inhabitants"

      - name: results_kinderarmut_kreise
        description: "Child poverty per district (Kreis): non-working SGB II recipients under 15 years per 100 inhabitants, long format"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Non-working SGB II recipients under 15 years per 100 inhabitants"

      - name: results_medianeinkommen_kreise
        description: "Median income per district (Kreis), long format, one record per region and year (euro)"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Median income in euros"

      - name: results_studierende_kreise
        description: "Students per 1,000 inhabitants per district (Kreis), long format, one record per region and year"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Students per 1,000 inhabitants"

      - name: results_sv_beschaeftigte_kreise
        description: "Employees subject to social insurance contributions at place of work per district (Kreis), Statistik der Bundesagentur für Arbeit (June value, fetch_ba_sv_beschaeftigte.py), long format, one record per region and year"
        columns:
          - name: original_id_1
            tests:
              - not_null
          - name: geodata_id_nuts
            tests:
              - not_null
          - name: year
            tests:
              - not_null
          - name: value
            description: "Number of employees subject to social insurance contributions (absolute)"
