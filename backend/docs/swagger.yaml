basePath: /api/v1
definitions:
  handlers.CustomRegionAggregateRequest:
    properties:
      datasets:
        example:
        - bevoelkerung
        - schuldnerquote
        items:
          type: string
        type: array
      from_year:
        example: 2015
        type: integer
      geometry:
        type: object
      min_share:
        example: 0.01
        type: number
      to_year:
        example: 2024
        type: integer
    type: object
  handlers.CustomRegionAggregateRow:
    properties:
      aggregation_method:
        example: weighted_avg_population
        type: string
      coverage:
        example: 0.98
        type: number
      dataset_slug:
        example: schuldnerquote
        type: string
      indicator:
        example: schuldnerquote
        type: string
      is_crosswalked:
        description: |-
          IsCrosswalked: mindestens ein beteiligter Einheitenwert wurde über eine
          Versionsgrenze umgerechnet (kein Direktwert).
        example: false
        type: boolean
      level_used:
        example: nuts3
        type: string
      matched_unit:
        description: |-
          MatchedUnit ist gesetzt, wenn das Polygon exakt einer bestehenden Einheit
          der genutzten Ebene entspricht (nuts_id, gisco_id bzw. ba_schl); die Werte
          sind dann die Werte dieser Einheit, ohne Beiträge benachbarter Einheiten.
        example: DE300
        type: string
      month:
        example: 6
        type: integer
      source_region_count:
        example: 3
        type: integer
      value:
        example: 7.4
        type: number
      value_kind:
        example: rate
        type: string
      year:
        example: 2023
        type: integer
    type: object
  handlers.customRegionMeta:
    properties:
      dataset_slug:
        example: schuldnerquote
        type: string
      finer_slug:
        type: string
      indicator:
        example: schuldnerquote
        type: string
      kind:
        example: rate
        type: string
      level:
        example: nuts3
        type: string
      measure_type:
        example: weighted_avg
        type: string
    type: object
  models.APIResponse:
    properties:
      data: {}
      error:
        example: ""
        type: string
      message:
        example: Operation erfolgreich
        type: string
      meta:
        $ref: '#/definitions/models.MetaInfo'
      success:
        example: true
        type: boolean
    type: object
  models.AgenturDatasetAggregatePoint:
    properties:
      aggregation_method:
        description: |-
          Wie der Wert entstanden ist (siehe mart_agentur_dataset_aggregate):
          "sum" = Summe der Kreis-Werte; "weighted_avg_population" =
          bevölkerungsgewichteter Durchschnitt der Kreis-Werte;
          "weighted_avg_area" = flächengewichteter Durchschnitt (Rückfall, wenn
          für einen beteiligten Kreis die Bevölkerung fehlt). Die beiden
          Durchschnitte sind eine Näherung, keine exakte Neuberechnung.
        enum:
        - sum
        - weighted_avg_population
        - weighted_avg_area
        example: weighted_avg_population
        type: string
      ba_schl:
        example: "962"
        type: string
      dataset_slug:
        example: bevoelkerung
        type: string
      is_computed:
        description: |-
          Immer true: jeder Punkt ist eine flächengewichtete Aggregation über
          mehrere Kreise, keine an einer einzelnen Quelle abgelesene
          Einzelbeobachtung.
        example: true
        type: boolean
      is_interpolated:
        description: |-
          Immer false - keine gap-gefüllte Version wird hier aggregiert. Nicht
          aus der DB gescannt, damit TimeseriesChart.vue/DataTable.vue dieselbe
          Interpolationsstatus-Spalte wie bei den anderen Aggregat-Endpunkten
          anzeigen können.
        example: false
        type: boolean
      source_region_count:
        description: Anzahl der Kreise, die für dieses Jahr tatsächlich einen Wert
          beigetragen haben.
        example: 3
        type: integer
      value:
        example: 340123
        type: number
      value_kind:
        description: |-
          Art der Größe: "count" (Zählgröße), "rate" (Quote), "mean"
          (Durchschnitt) oder "median". Mediane lassen sich nicht aus Kreis-
          Medianen zusammensetzen - der Wert ist dann nur eine Schätzung.
        enum:
        - count
        - rate
        - mean
        - median
        example: rate
        type: string
      year:
        example: 2022
        type: integer
    type: object
  models.AgenturDatasetAggregateYear:
