        in: query
        items:
          type: string
        name: dataset
        required: true
        type: array
      - description: Einzelnes Jahr filtern
        example: 2022
        in: query
        name: year
        type: integer
      - description: Jahresbereich ab
        example: 2018
        in: query
        name: from_year
        type: integer
      - description: Jahresbereich bis
        example: 2022
        in: query
        name: to_year
        type: integer
      - description: Auf NUTS-Präfix einschränken (z.B. DE1 für alle Kreise in Bayern)
        example: DE1
        in: query
        name: nuts_parent_id
        type: string
      - description: NUTS-ID einer Region für Regionalwert und Ranking
        example: DEF01
        in: query
        name: geodata_id_nuts
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
