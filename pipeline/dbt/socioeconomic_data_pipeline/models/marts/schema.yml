version: 2

models:
  - name: mart_region_datasets
    description: "Vorberechnete Tabelle: verfügbare (geodata_id_nuts, dataset_slug, year)-Kombinationen aus allen Staging-Modellen. Dient als Index für den /datasets-Endpunkt."
    columns:
      - name: geodata_id_nuts
        description: "NUTS-Code der Region (z.B. DEF01)"
        tests:
          - not_null
      - name: dataset_slug
        description: "Datensatz-Slug (entspricht RouteSlug in der Go-API, z.B. bevoelkerung)"
        tests:
          - not_null
      - name: year
        description: "Datenjahr"
        tests:
          - not_null

  - name: lau_integrated
    description: "Integrated LAU dataset combining geometry and population data for all available years"
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO (Eurostat)"
        tests:
          - not_null
      - name: year
        description: "Data year"
        tests:
          - not_null
      - name: lau_name_national
        description: "LAU name in national language"
      - name: lau_name_latin
        description: "LAU name in Latin characters"
      - name: cntr_code
        description: "Country code (2-letter ISO)"
        tests:
          - not_null
      - name: nuts_id
        description: "NUTS region identifier"
      - name: geometry
        description: "PostGIS geometry (polygon) in EPSG:3035"
      - name: population
        description: "Population count for the year"
      - name: missing_population_data
        description: "Flag indicating if population data is missing for this LAU/year"
      - name: year_match
        description: "Flag indicating if geometry and population year match"
      - name: total_years_available
        description: "Total number of years available for this LAU"
      - name: years_with_population
        description: "Number of years with population data for this LAU"

  - name: mart_nuts3_summary
    description: "Alle verfügbaren sozioökonomischen Indikatoren je NUTS-3-Region und Jahr. Basis ist ein FULL OUTER JOIN zwischen Bevölkerung und Schuldnerquote; Arbeitslosenzahlen werden per LEFT JOIN ergänzt (nur Jahresdaten)."
    columns:
      - name: nuts_id
        description: "NUTS-3-Code der Region (z.B. DE111)"
        tests:
          - not_null
      - name: region_name
        description: "Name der Region"
      - name: year
        description: "Datenjahr"
        tests:
          - not_null
      - name: bevoelkerung
        description: "Bevölkerungszahl (null wenn keine Daten für dieses Jahr)"
      - name: schuldnerquote_prozent
        description: "Schuldnerquote in Prozent (null wenn keine Daten für dieses Jahr)"
      - name: arbeitslose
        description: "Zahl der Arbeitslosen (Jahresdurchschnitt). Kann null sein, da Arbeitsagenturbezirke nicht 1:1 mit NUTS-3-Kreisen übereinstimmen."
      - name: yoy_change_percent
        description: "Veränderung der Arbeitslosenzahlen gegenüber dem Vorjahr in Prozent"

  - name: mart_nuts_geometry
    description: "NUTS-Geometrien mit GeoJSON-Ausgabe und Geometrie-Metadaten für verfügbare Referenzjahre"
    columns:
      - name: nuts_id
        description: "NUTS-Code der Region"
        tests:
          - not_null
      - name: levl_code
        description: "NUTS-Level (0-3)"
      - name: country_code
        description: "ISO-Ländercode"
      - name: region_name
        description: "Regionsname"
      - name: year
        description: "Referenzjahr der Geometrie"
        tests:
          - not_null
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84"
      - name: has_valid_geometry
        description: "Flag für valide Geometrie"

  - name: lau_data_quality
    description: "Data quality metrics and issue tracking for LAU integration"
    columns:
      - name: report_type
        description: "Type of report: summary, missing_data, or year_mismatch"
        tests:
          - not_null
          - accepted_values:
              values: ['summary', 'missing_data', 'year_mismatch']
      - name: year
        description: "Data year"
        tests:
          - not_null
      - name: population_coverage_percent
        description: "Percentage of LAUs with population data for the year"
      - name: issue_type
        description: "Description of data quality issue"

  - name: mart_nuts_geometry_historized
    description: "Historisierte NUTS-Geometrien. Eine Zeile je Region und Geometrie-Periode. Vintages mit identischer Geometrie werden zusammengefasst. Datenquelle: stg_nuts_geometry."
    columns:
      - name: nuts_id
        description: "NUTS-Code der Region (z.B. DE111)"
        tests:
          - not_null
      - name: levl_code
        description: "NUTS-Level (0–3)"
      - name: country_code
        description: "ISO-Ländercode (2-stellig)"
      - name: region_name
        description: "Regionsname"
      - name: valid_from
        description: "Erstes Vintage-Jahr, in dem diese Geometrie-Version erscheint"
        tests:
          - not_null
      - name: valid_to
        description: "Letztes Jahr, in dem diese Version gültig war. NULL bedeutet noch aktuell."
      - name: max_vintage_year
        description: "Letztes Vintage-Jahr, in dem diese Geometrie-Version vorlag"
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "Flag: true wenn geometry_3035 nicht null und nicht leer"

  - name: mart_lau_geometry_historized
    description: "Historisierte LAU-Geometrien (Local Administrative Units). Eine Zeile je LAU-Einheit und Geometrie-Periode. Vintages mit identischer Geometrie werden zusammengefasst. Datenquelle: stg_lau_geometry."
    columns:
      - name: gisco_id
        description: "Eindeutiger LAU-Identifier aus GISCO (Eurostat)"
        tests:
          - not_null
      - name: country_code
        description: "ISO-Ländercode (2-stellig)"
      - name: lau_id
        description: "LAU-Identifier (national)"
      - name: lau_name
        description: "Name der LAU-Einheit"
      - name: nuts_3
        description: "NUTS-3-Code der übergeordneten Region (nullable)"
      - name: valid_from
        description: "Erstes Vintage-Jahr, in dem diese Geometrie-Version erscheint"
        tests:
          - not_null
      - name: valid_to
        description: "Letztes Jahr, in dem diese Version gültig war. NULL bedeutet noch aktuell."
      - name: max_vintage_year
        description: "Letztes Vintage-Jahr, in dem diese Geometrie-Version vorlag"
      - name: geometry_3035
        description: "PostGIS-Geometrie in EPSG:3035 (Lambert Azimuthal Equal-Area)"
      - name: geometry_wgs84
        description: "GeoJSON-Geometrie in WGS84 (EPSG:4326)"
      - name: has_valid_geometry
        description: "Flag: true wenn geometry_3035 nicht null und nicht leer"

  - name: mart_socioeconomic_inventory
    description: "Voraggregiertes Inventar der verfügbaren Soziodaten je Datensatz, Jahr und Geodatenebene"
    columns:
      - name: dataset
        description: "Dataset-Slug (API-Route, z.B. arbeitslose oder beschaeftigungsquote-gemeinden)"
        tests:
          - not_null
      - name: year
        description: "Jahr der Beobachtung"
        tests:
          - not_null
      - name: geodata_level
        description: "Geodatenebene (z.B. NUTS_3, LAU)"
        tests:
          - not_null
      - name: records
        description: "Anzahl Datensätze in der Kombination aus dataset, year und geodata_level"
      - name: distinct_geodata_nuts
        description: "Anzahl unterschiedlicher geodata_id_nuts"
      - name: distinct_geodata_lau
        description: "Anzahl unterschiedlicher geodata_id_lau"
      - name: distinct_geodata_ars
        description: "Anzahl unterschiedlicher geodata_id_ars"
