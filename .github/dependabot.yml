version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/web/app
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /pipeline/dlt
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend/web/app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /backend/deployments
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/hetzner
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ssh-setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
