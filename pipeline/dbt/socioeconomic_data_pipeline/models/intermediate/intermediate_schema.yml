version: 2

models:
  - name: int_lau_geometry_canonical
    description: "One representative geometry per German LAU (municipality), taken from the most recent geometry period."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO"
        data_type: text
        tests:
          - unique
          - not_null

      - name: geometry_3035
        description: "Geometry in EPSG:3035"
        data_type: geometry

  - name: int_lau_nuts3_membership
    description: "Majority assignment of each German LAU to the NUTS-3 region holding the largest share of its area, per NUTS boundary version and population year (one row per LAU/year/version)."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO"
        data_type: text
        tests:
          - not_null

      - name: year
        description: "Population year"
        data_type: integer
        tests:
          - not_null

      - name: version_year
        description: "NUTS boundary version year (2003, 2006, 2010, 2013, 2016, 2021, 2024)"
        data_type: integer
        tests:
          - not_null

      - name: nuts_id
        description: "NUTS-3 region holding the largest share of the LAU"
        data_type: text
        tests:
          - not_null

      - name: area_share
        description: "ST_Area(LAU ∩ region) / ST_Area(LAU) of the assigned region (informational)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - gisco_id
            - year
            - version_year

  - name: int_lau_nuts3_population_weight
    description: "Population-based weight for each NUTS-3 source/target region pair across NUTS boundary versions."
    columns:
      - name: source_version
        description: "Source NUTS boundary version year"
        data_type: integer
        tests:
          - not_null

      - name: target_version
        description: "Target NUTS boundary version year"
        data_type: integer
        tests:
          - not_null

      - name: source_nuts_id
        description: "Source NUTS-3 region"
        data_type: text
        tests:
          - not_null

      - name: target_nuts_id
        description: "Target NUTS-3 region"
        data_type: text
        tests:
          - not_null

      - name: lau_population
        description: "Inhabitants of this source/target pair: sum of LAU population x area(LAU ∩ source ∩ target) / area(LAU)"
        data_type: numeric
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_version
            - target_version
            - source_nuts_id
            - target_nuts_id

  - name: int_lau_nuts3_spatial_link
    description: "Spatial fallback that links each LAU to the NUTS-3 region with the largest area overlap in the reference NUTS version (2024)."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO"
        data_type: text
        tests:
          - unique
          - not_null

      - name: nuts_id
        description: "Linked NUTS-3 region (estimate, not an official assignment)"
        data_type: text
        tests:
          - not_null

  - name: int_lau_population_geo
    description: "LAU population joined with its geometry, for German municipalities with valid data."
    columns:
      - name: gisco_id
        description: "Unique LAU identifier from GISCO"
        data_type: text
        tests:
          - not_null

      - name: year
        description: "Population year"
        data_type: integer
        tests:
          - not_null

      - name: population_count
        description: "Population count"
        data_type: bigint
        tests:
          - not_null

      - name: geometry_3035
        description: "Geometry in EPSG:3035"
        data_type: geometry

  - name: int_lau_spatial_crosswalk
    description: "Spatial overlap between German LAU geometries of different geometry vintages, with the share of the source area that overlaps the target area."
    columns:
      - name: source_gisco_id
        description: "Source LAU identifier from GISCO"
        data_type: text
        tests:
          - not_null

      - name: source_version
        description: "Source LAU version year"
        data_type: integer
        tests:
          - not_null

      - name: target_gisco_id
        description: "Target LAU identifier from GISCO"
        data_type: text
        tests:
          - not_null

      - name: target_version
        description: "Target LAU version year"
        data_type: integer
        tests:
          - not_null

      - name: area_fraction
        description: "Share of the source area that overlaps the target area (above 1 %)"
        data_type: numeric
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - source_gisco_id
            - source_version
            - target_gisco_id
            - target_version

  - name: int_nuts3_de_geometry
    description: "German NUTS-3 geometries per vintage year (levl_code 3, valid geometry), materialized with a GiST index as the indexed input for spatial self-joins (int_nuts_spatial_crosswalk)."
    columns:
      - name: nuts_id
        description: "NUTS-3 code"
        data_type: text
        tests:
          - not_null

      - name: version_year
        description: "NUTS vintage year (stg_nuts_geometry.year)"
        data_type: bigint
        tests:
          - not_null

      - name: geometry_3035
        description: "Geometry in EPSG:3035"
        data_type: geometry
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - nuts_id
            - version_year

  - name: int_nuts_spatial_crosswalk
    description: "Spatial overlap between German NUTS-3 regions of different boundary versions, with the share of the source area that overlaps the target area."
    columns:
      - name: source_version
        description: "Source NUTS boundary version year"
        data_type: integer
        tests:
          - not_null

      - name: target_version
        description: "Target NUTS boundary version year"
        data_type: integer
        tests:
          - not_null

      - name: source_nuts_id
        description: "Source NUTS-3 region"
        data_type: text
        tests:
          - not_null

      - name: target_nuts_id
        description: "Target NUTS-3 region"
        data_type: text
        tests:
          - not_null

      - name: area_fraction
        description: "Share of the source area that overlaps the target area (above 1 %)"
        data_type: numeric
        tests:
          - not_null

  - name: int_beschaeftigungsquote_nuts3
    description: "Beschäftigungsquote aggregated from municipalities (LAU) to NUTS-3: population-weighted mean (approximation, see weight_coverage), unweighted mean and median per NUTS-3 region and year. Feeds stg_beschaeftigungsquote_nuts3 (API) and mart_beschaeftigungsquote_nuts3."
    columns:
      - name: beschaeftigungsquote_nuts3_pk
        description: "Surrogate key of NUTS-3 region and year"
        data_type: text
        tests:
          - unique
          - not_null

  - name: int_nuts_expected_kreis_count
    description: "Expected number of Kreise (NUTS-3 regions) per NUTS-0/1/2 region in the reference NUTS version (var reference_nuts_version); denominator of the coverage flags of mart_nuts012_dataset_aggregate and mart_nuts0/1/2_summary."
    columns:
      - name: nuts_level
        description: "NUTS level of the aggregation region (0, 1 or 2)"
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2]
      - name: nuts_id
        description: "NUTS-0/1/2 code (prefix of the contained NUTS-3 codes)"
        data_type: text
        tests:
          - not_null
      - name: expected_region_count
        description: "Number of NUTS-3 regions of the reference version whose code starts with nuts_id"
        data_type: bigint
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - nuts_level
            - nuts_id
